<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reels Canvas, a concept by Keshav Tiwari</title>
<meta name="description" content="A prototype for watching and replying to the reels a friend sends you, without leaving the reel.">
<style>
@font-face{font-family:KeshavHand;src:url(KeshavHand.woff) format("woff"),url(KeshavHand.ttf) format("truetype");font-display:swap}
:root{--paper:#f4f1ea;--pen:#232326;--pencil:#8a857b;--accent:#5c77f7;
  --ig:#0c1014;--ig2:#25282e;--their:#442c6e;--mine:#e3b8e6;--ring:conic-gradient(from 200deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--pen);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{display:block}

/* ---------- Page: just the phone, with handwritten prompts beside it ---------- */
.stage{min-height:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:64px;align-items:center;padding:32px}
.guide{justify-self:end;max-width:330px;position:relative}
.say{font-family:KeshavHand,"Bradley Hand",cursive;font-size:39px;line-height:1.15;color:#141416;min-height:3.6em;-webkit-text-stroke:.35px #141416}
.arrow{margin:14px 0 0 auto;color:var(--pen);width:132px;height:60px}
.credit{position:fixed;left:30px;bottom:22px;font-family:KeshavHand,"Bradley Hand",cursive;font-size:21px;color:var(--pencil);display:flex;gap:18px;align-items:baseline}
.credit a,.credit button{color:var(--pencil);font-size:21px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.credit a:hover,.credit button:hover{color:var(--pen)}

.phone{height:min(874px,calc(100svh - 64px));aspect-ratio:402/874;border-radius:58px;padding:11px;background:#111113;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 34px 80px rgba(40,28,10,.2),0 8px 22px rgba(40,28,10,.1)}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:#000;color:#f5f5f5;isolation:isolate;user-select:none;-webkit-user-select:none}
.status{position:absolute;top:0;left:0;right:0;height:50px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:8px 34px 0 40px;font-size:16px;font-weight:600;pointer-events:none;color:#fff}
.status .r{display:flex;gap:6px;align-items:center}
.status .bat{min-width:26px;height:13px;border-radius:4px;background:#fff;color:#000;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;border-radius:20px;background:#000;z-index:61}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.av{flex:none;border-radius:50%;background:#333 center/cover no-repeat;display:block}
.ring{padding:3px;border-radius:50%;background:var(--ring)}

/* Inbox */
.inbox{background:var(--ig);padding-top:52px}
.ib-head{display:flex;align-items:center;justify-content:center;height:46px;position:relative}
.ib-head b{font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:4px}
.ib-head .compose{position:absolute;right:18px}
.ib-search{margin:12px 14px 10px;height:42px;border-radius:21px;background:var(--ig2);display:flex;align-items:center;gap:10px;padding:0 14px;color:#a8a8a8;font-size:16px}
.ib-notes{display:flex;gap:14px;padding:30px 16px 6px;overflow:hidden}
.nt{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;position:relative}
.nt .av{width:76px;height:76px}
.nt .bub{position:absolute;top:-26px;left:50%;transform:translateX(-50%);max-width:92px;padding:6px 10px;border-radius:16px;background:#2b2e34;font-size:12px;line-height:1.2;text-align:center;color:#e8e8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.nt .bub::after{content:"";position:absolute;left:18px;bottom:-5px;width:9px;height:9px;border-radius:50%;background:#2b2e34}
.nt .bub.g{color:#a8a8a8}
.nt small{margin-top:6px;font-size:12.5px;color:#e8e8e8;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt small.g{color:#a8a8a8}
.ib-sec{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.ib-sec b{font-size:16px;font-weight:700}
.ib-sec span{color:#a8a8a8;font-weight:600;font-size:15px}
.ib-list{flex:1;overflow-y:auto;padding-bottom:110px;scrollbar-width:none}
.ib-list::-webkit-scrollbar{display:none}
.row{display:flex;gap:12px;align-items:center;padding:8px 16px;width:100%;text-align:left}
.row:active{background:#15191e}
.row .av{width:56px;height:56px}
.row .mid{flex:1;min-width:0}
.row .nm{display:block;font-size:15px;color:#f5f5f5}
.row .sub{display:block;font-size:14px;color:#a8a8a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .nm,.row.unread .sub{font-weight:650;color:#f5f5f5}
.row .sub i{font-style:normal;color:#a8a8a8;font-weight:400}
.row .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tabbar{position:absolute;left:16px;right:16px;bottom:22px;height:64px;border-radius:32px;background:rgba(30,33,38,.72);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:5}
.tabbar span{width:66px;height:50px;border-radius:25px;display:grid;place-items:center;position:relative}
.tabbar span.on{background:rgba(255,255,255,.12)}
.tabbar .red{position:absolute;right:20px;bottom:12px;width:7px;height:7px;border-radius:50%;background:#ff3040}
.tabbar .me{width:26px;height:26px}

/* Thread (chat theme sampled from reference screenshots) */
.thread{background:linear-gradient(#381b3d,#2c1a30 55%,#241726)}
.th-head{position:absolute;left:0;right:0;top:0;z-index:4;padding:56px 12px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(36,18,40,.92),rgba(36,18,40,.6) 75%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.glass{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(20,12,24,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.th-head .who{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.th-head .av{width:36px;height:36px}
.th-head b{font-size:17px;display:flex;align-items:center;gap:4px}
.th-head small{display:block;color:rgba(255,255,255,.5);font-size:13px}
.th-head .acts{display:flex;gap:8px}
.msgs{flex:1;overflow-y:auto;padding:118px 12px 150px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.ts{align-self:center;font-size:12px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.85);margin:14px 0 10px}
.mb{max-width:76%;padding:9px 14px;border-radius:22px;font-size:16px;line-height:1.3}
.mb.them{background:var(--their);color:#fff}
.mb.me{align-self:flex-end;background:var(--mine);color:#000}
.mb.me.big{background:none;font-size:44px;padding:0 6px;line-height:1.05}
.grp{display:flex;gap:8px;align-items:flex-end}
.grp > .av{width:28px;height:28px;margin-bottom:2px}
.grp .col{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.share{display:flex;gap:12px;align-items:center}
.reelcard{position:relative;width:160px;height:284px;border-radius:18px;overflow:hidden;background:#222 center/cover;cursor:pointer;flex:none;transition:transform .2s}
.reelcard:active{transform:scale(.97)}
.reelcard::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 30%)}
.reelcard .by{position:absolute;left:10px;right:8px;top:10px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.reelcard .by .av{width:22px;height:22px}
.reelcard .by span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reelcard .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.reelcard .ri{position:absolute;left:12px;bottom:12px;width:24px;height:24px;border-radius:6px;background:#fff;display:grid;place-items:center;color:#000}
.side{display:flex;flex-direction:column;gap:14px}
.side span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(120,70,170,.55)}
.mine{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin:4px 0}
.mine small{font-size:12px;color:rgba(255,255,255,.55);padding-right:8px}
.watch{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;padding:11px 18px 11px 14px;border-radius:999px;background:var(--mine);color:#1a0d1d;font-weight:650;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5}
.composer{position:absolute;left:12px;right:12px;bottom:22px;height:54px;border-radius:27px;background:rgba(18,10,20,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:14px;padding:0 16px 0 6px;z-index:5}
.composer .cam{width:42px;height:42px;border-radius:50%;background:var(--mine);display:grid;place-items:center;color:#1a0d1d}
.composer .ph{flex:1;color:rgba(255,255,255,.55);font-size:16px}

/* ---------- Reel player ---------- */
.player{position:absolute;inset:0;z-index:20;background:#000;touch-action:none}
.track{position:absolute;left:0;right:0;top:0;bottom:84px;overflow:hidden;touch-action:none;cursor:grab;background:#000}
.player.dragging .track{cursor:grabbing}
.card{position:absolute;inset:0;overflow:hidden;background:#000;will-change:transform}
.card.raised{box-shadow:-24px 0 60px rgba(0,0,0,.6)}
.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.card::before{content:"";position:absolute;inset:0 0 auto;height:150px;background:linear-gradient(rgba(0,0,0,.45),transparent);z-index:1;pointer-events:none}
.card::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none;z-index:1}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:6}
.paused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);z-index:3;opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.2,1.4,.4,1);pointer-events:none;width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center}
.card.is-paused .paused{opacity:1;transform:translate(-50%,-50%) scale(1)}
.rail{position:absolute;right:10px;bottom:16px;z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center;font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.rail span{display:flex;flex-direction:column;align-items:center;gap:4px}
.rail svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.creator{position:absolute;left:14px;right:70px;bottom:18px;z-index:3}
.creator .line{display:flex;align-items:center;gap:9px}
.creator .ring{padding:2px}
.creator .ring .av{width:34px;height:34px;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.creator b{font-size:15px;display:flex;align-items:center;gap:4px}
.follow{padding:4px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.55);font-size:14px;font-weight:600;margin-left:4px}
.cap{margin-top:9px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.18);z-index:4}
.prog i{display:block;height:100%;width:0;background:rgba(255,255,255,.85)}
.note{position:absolute;left:14px;bottom:100px;z-index:4;max-width:74%;display:flex;gap:9px;align-items:flex-end;transform-origin:0 100%;opacity:0;transform:scale(.5) translateY(16px)}
.note .av{width:28px;height:28px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.note .mb{background:var(--their);font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.note .mb small{display:block;font-size:11px;opacity:.65;font-weight:600;margin-bottom:1px}
.card.active .note{animation:pop .6s cubic-bezier(.2,1.5,.4,1) .4s forwards}
@keyframes pop{to{opacity:1;transform:none}}
.endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px;background:linear-gradient(#2c1a30,#120c14)}
.endcard .check{width:68px;height:68px;border-radius:50%;background:var(--mine);color:#1a0d1d;display:grid;place-items:center;margin-bottom:8px}
.endcard h4{font-size:22px}
.endcard p{color:rgba(255,255,255,.6);font-size:15px;max-width:250px}
.endcard .btns{display:flex;flex-direction:column;gap:10px;margin-top:16px;width:100%;max-width:240px}
.endcard .btns button{padding:12px;border-radius:12px;background:#fff;color:#000;font-weight:650}
.endcard .btns button.ghost{background:rgba(255,255,255,.12);color:#fff}

.chrome{position:absolute;inset:0;z-index:10;pointer-events:none}
.chrome > *{pointer-events:auto}
.pl-head{position:absolute;left:0;right:0;top:0;padding:56px 14px 0;display:flex;align-items:center;gap:6px;pointer-events:none}
.pl-head > *{pointer-events:auto}
.pl-head .who{flex:1;display:flex;align-items:center;gap:10px;margin-left:4px}
.pl-head .av{width:34px;height:34px}
.pl-head b{font-size:16px;display:block;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.pl-head small{display:block;font-size:13px;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.bar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#000}
.bar > div{position:absolute;inset:10px 14px auto;display:flex;gap:10px;transition:opacity .2s,transform .35s cubic-bezier(.2,1.1,.3,1)}
.bar > div.hide{opacity:0;transform:translateY(14px);pointer-events:none}
.reply{height:46px;border-radius:23px;background:#1d2025;align-items:center;padding:0 10px 0 18px}
.reply input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;font-size:16px;outline:none}
.reply input::placeholder{color:#e8e8e8}
.reply .rx{font-size:25px;width:40px;height:40px;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.reply .rx:active{transform:scale(1.4)}
.reply .plus{width:34px;height:40px;display:grid;place-items:center;color:#a8a8a8}
.pair button{flex:1;white-space:nowrap;height:46px;border-radius:12px;background:#262626;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:15px}
.pair .av{width:26px;height:26px}
.fx{position:absolute;z-index:30;font-size:26px;pointer-events:none;will-change:transform}
.fly{position:absolute;z-index:30;pointer-events:none;padding:8px 13px;border-radius:20px;background:var(--mine);color:#000;font-size:15px;white-space:nowrap}

/* Mobile: the phone is the screen; a handwritten intro comes first */
.intro{background:var(--paper);color:var(--pen);padding:90px 30px 40px;justify-content:center;gap:18px;font-family:KeshavHand,"Bradley Hand",cursive}
.intro h1{font-size:52px;font-weight:400;line-height:1}
.intro p{font-size:27px;line-height:1.2}
.intro .go{margin-top:14px;align-self:flex-start;font-family:inherit;font-size:28px;color:var(--pen);text-decoration:underline;text-underline-offset:5px}
.intro small{font-size:20px;color:var(--pencil)}
@media (max-width:900px){
  .stage{display:block;padding:0}
  .guide,.credit{display:none}
  .phone{width:100vw;height:100svh;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none;background:#000}
  .screen{border-radius:0}
  .island,.status{display:none}
}
</style>
</head>
<body>
<main class="stage">
  <div class="guide">
    <p class="say" id="say"></p>
    <svg class="arrow" viewBox="0 0 132 60" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 10c18 30 52 42 112 32"/><path d="M104 32l15 10-13 11"/>
    </svg>
  </div>
  <div class="phone"><div class="screen" id="screen">
    <div class="island"></div>
    <div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.5c2.3 0 4.4.9 6 2.4l1.3-1.3A10.3 10.3 0 0 0 8.5.6 10.3 10.3 0 0 0 1.2 3.6l1.3 1.3c1.6-1.5 3.7-2.4 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.3a6.7 6.7 0 0 0-9.4 0l1.3 1.3c.9-.8 2.1-1.3 3.4-1.3zm0 3.5L10.4 8a2.8 2.8 0 0 0-3.8 0z"/></svg><span class="bat">90</span></span></div>
  </div></div>
  <div></div>
</main>
<p class="credit"><span>Reels Canvas, a concept by <a href="https://keshavtiwari.com">Keshav Tiwari</a></span><button onclick="location.reload()">start over</button></p>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const I = {

  down: '<path d="m6 9 6 6 6-6"/>',
  aiSearch: '<path d="M19 11a8 8 0 1 1-3-6.2"/><path d="m17 17 4 4"/><path d="M18 2.5v4M16 4.5h4"/>',
  back: '<path d="M15 4 7 12l8 8"/>',
  chevR: '<path d="m9 6 6 6-6 6"/>',

  phone: '<path d="M21 16.4v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.6 5.2 2 2 0 0 1 4.6 3h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.6 10.7a16 16 0 0 0 4.7 4.7l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  video: '<rect x="2.5" y="5.5" width="14" height="13" rx="3"/><path d="m16.5 10.5 5-3v9l-5-3"/>',
  remix: '<circle cx="6" cy="18" r="2.5"/><circle cx="14" cy="18" r="2.5"/><path d="M7.5 16 15 5M12.5 16 9 11"/><path d="M18 3v4M16 5h4"/>',

/* ---------- Spring ---------- */
function spring({ from, to, v = 0, k = 380, c = 34, eps = 0.5, onUpdate, onDone }) {
  let x = from, vel = v, last = performance.now(), id = 0, done = false;
  const handle = { stop() { cancelAnimationFrame(id); done = true; } };
  if (reduce) { onUpdate(to); onDone && onDone(); return handle; }
  const step = now => {
    if (done) return;
    const dt = Math.min(0.032, (now - last) / 1000); last = now;
    for (let i = 0; i < 4; i++) { const a = -k * (x - to) - c * vel; vel += a * dt / 4; x += vel * dt / 4; }
    if (Math.abs(x - to) < eps && Math.abs(vel) < eps * 10) { done = true; onUpdate(to); onDone && onDone(); return; }
    onUpdate(x); id = requestAnimationFrame(step);
  };
  id = requestAnimationFrame(step);
  return handle;
}

function push(next, prev, back = false) {
  if (reduce) { screen.appendChild(next); prev && prev.remove(); return; }
  const ease = 'cubic-bezier(.2,.9,.25,1)', d = 440;
  if (!back) {
    screen.appendChild(next);
    next.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], { duration: d, easing: ease });
    prev && prev.animate([{ transform: 'none', filter: 'brightness(1)' }, { transform: 'translateX(-28%)', filter: 'brightness(.5)' }], { duration: d, easing: ease }).finished.then(() => prev.remove());
  } else {
    screen.insertBefore(next, prev);
    next.animate([{ transform: 'translateX(-28%)', filter: 'brightness(.5)' }, { transform: 'none', filter: 'brightness(1)' }], { duration: d, easing: ease });
    prev.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }], { duration: d, easing: ease }).finished.then(() => prev.remove());
  }
}

function nbPosFor(dir) {
  if (T.override) return T.override;
  const { r, c } = T.pos;
  return T.axis === 'y' ? { r: r + dir, c: 0 } : { r, c: c + dir };
}

  if (dir !== T.dir) {
    clearNb(); T.dir = dir;
    if (dir) { const p = nbPosFor(dir); if (exists(p.r, p.c)) { T.nb = card(p.r, p.c); T.nbPos = p; P.track.appendChild(T.nb); } }
  }

}
function apply() {
  const ax = T.axis || 'y', size = sizeOf(), off = T.off;
  const tf = v => ax === 'x' ? `translate3d(${v}px,0,0)` : `translate3d(0,${v}px,0)`;
  if (ax === 'y' || !T.nb) {
    T.cur.style.transform = tf(off); setShade(T.cur, 0);
    if (T.nb) T.nb.style.transform = tf(off + T.dir * size);
    return;
  }
  const p = Math.min(1, Math.abs(off) / size);
  if (T.dir === 1) {        // going deeper: the next reel slides over this one
    T.cur.style.zIndex = 1; T.cur.style.transform = tf(off * 0.3); setShade(T.cur, p * 0.55);
    T.nb.style.zIndex = 2; T.nb.style.transform = tf(size + off); T.nb.classList.add('raised'); setShade(T.nb, 0);
  } else {                  // coming back: this reel slides off and uncovers the one beneath
    T.cur.style.zIndex = 2; T.cur.style.transform = tf(off); T.cur.classList.add('raised'); setShade(T.cur, 0);
    T.nb.style.zIndex = 1; T.nb.style.transform = tf((-size + off) * 0.3); setShade(T.nb, (1 - p) * 0.55);
  }
}
function release(v) {
  const size = sizeOf(); let target = 0;
  if (T.nb) {
    const proj = T.off + v * 0.12;
    if (T.dir === 1 && proj < -size * 0.3) target = -size;
    if (T.dir === -1 && proj > size * 0.3) target = size;
  }
  T.anim = spring({ from: T.off, to: target, v, onUpdate: x => { T.off = Math.max(-size, Math.min(size, x)); apply(); },
    onDone: () => { T.anim = null; if (target) commit(); else { clearNb(); T.off = 0; apply(); T.axis = null; T.override = null; } } });
}
function commit() {
  const old = T.cur;
  T.cur = T.nb; T.pos = T.nbPos; T.nb = null; T.nbPos = null;
  old.remove();
  Object.assign(T, { dir: 0, off: 0, axis: null, override: null });
  T.cur.style.transform = ''; T.cur.style.zIndex = ''; T.cur.classList.remove('raised'); setShade(T.cur, 0);
  onSettle();
}
function go(ax, dir, override) {
  if (!P || P.opening || T.anim || drag) return;
  clearNb();
  T.axis = ax; T.override = override || null;
  setOffset(-dir * 0.01);
  if (T.nb) return release(-dir * sizeOf() * 5);
  T.anim = spring({ from: 0, to: 0, v: -dir * 700, onUpdate: x => { T.off = x; apply(); }, onDone: () => { T.anim = null; T.axis = null; T.override = null; clearNb(); } });
}
// A small sideways nudge that shows there's more to the right, without words on the screen.
function peek() {
  if (!P || T.anim || drag || T.pos.c !== 0 || !exists(T.pos.r, 1)) return;
  clearNb(); T.axis = 'x'; setOffset(-0.01);
  T.anim = spring({ from: 0, to: -80, k: 260, c: 24, onUpdate: x => { T.off = x; apply(); }, onDone: () => {
    T.anim = spring({ from: T.off, to: 0, k: 220, c: 22, onUpdate: x => { T.off = x; apply(); }, onDone: () => { T.anim = null; clearNb(); T.off = 0; apply(); T.axis = null; } });
  } });
}

/* ---------- Gestures ---------- */
function bindGestures() {
  const tr = P.track;
  tr.addEventListener('pointerdown', e => {
    if (P.opening || e.button > 0 || e.target.closest('button')) return;
    tr.setPointerCapture(e.pointerId);
    const caught = !!T.anim;
    if (T.anim) { T.anim.stop(); T.anim = null; }
    drag = { x0: e.clientX, y0: e.clientY, axis: caught && T.axis ? T.axis : null, off0: caught ? T.off : 0, s: [[e.timeStamp, e.clientX, e.clientY]], moved: caught };
    if (!drag.axis) { clearNb(); T.off = 0; T.axis = null; T.override = null; }
    P.el.classList.add('dragging');
  });
  tr.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.axis) {
      if (Math.hypot(dx, dy) < 8) return;
      drag.axis = T.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      drag.x0 = e.clientX; drag.y0 = e.clientY;
    }
    drag.moved = true;
    setOffset(drag.off0 + (drag.axis === 'x' ? e.clientX - drag.x0 : e.clientY - drag.y0));
    drag.s.push([e.timeStamp, e.clientX, e.clientY]); if (drag.s.length > 6) drag.s.shift();
  });
  const end = () => {
    if (!drag) return;
    P.el.classList.remove('dragging');
    const d = drag; drag = null;
    if (!d.moved || !d.axis) { T.axis = null; togglePause(); return; }
    const a = d.s[0], b = d.s[d.s.length - 1], dt = Math.max(1, b[0] - a[0]);
    const v = (d.axis === 'x' ? b[1] - a[1] : b[2] - a[2]) / dt * 1000;
    release(Math.abs(v) < 20000 ? v : 0);
  };
  tr.addEventListener('pointerup', end);
  tr.addEventListener('pointercancel', end);

  // Trackpad and mouse wheel: one move per gesture, then wait for the momentum to die down.
  let acc = { x: 0, y: 0 }, cool = false, coolT = 0;
  P.el.addEventListener('wheel', e => {
    e.preventDefault();
    if (cool) { clearTimeout(coolT); coolT = setTimeout(() => cool = false, 180); return; }
    acc.x += e.deltaX; acc.y += e.deltaY;
    if (Math.abs(acc.x) > 30 || Math.abs(acc.y) > 30) {
      const ax = Math.abs(acc.x) > Math.abs(acc.y) ? 'x' : 'y', d = ax === 'x' ? acc.x : acc.y;
      go(ax, d > 0 ? 1 : -1);
      acc = { x: 0, y: 0 }; cool = true; coolT = setTimeout(() => cool = false, 180);
    }
  }, { passive: false });
  window.addEventListener('keydown', onKey);
}
function togglePause() {
  const v = T.cur && T.cur.querySelector('video'); if (!v) return;
  if (v.paused) { v.play().catch(() => {}); T.cur.classList.remove('is-paused'); } else { v.pause(); T.cur.classList.add('is-paused'); }
}
function onKey(e) {
  if (!P || e.target.tagName === 'INPUT') return;
  const m = { ArrowDown: ['y', 1], ArrowUp: ['y', -1], ArrowRight: ['x', 1], ArrowLeft: ['x', -1] }[e.key];
  if (m) { e.preventDefault(); go(...m); }
  if (e.key === 'Escape') closePlayer();
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
}

/* ---------- Header and bottom bar ---------- */
function updateChrome() {
  const { r, c } = T.pos, row = rows[r];
  let sub;
  if (row.kind === 'end') sub = 'All caught up';
  else if (row.kind === 'feed') sub = 'Suggested for you';
  else if (c > 0) sub = `More ${TOPICS[row.topic].name}`;
  else sub = `Reel ${row.i + 1} of 4, sent ${SAM[row.i].when}`;
  if (P.sub.textContent !== sub) {
    P.sub.textContent = sub;
    if (!reduce) P.sub.animate([{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2,1.3,.4,1)' });
  }
  const mode = row.kind === 'sam' ? (c === 0 ? 'reply' : 'deeper') : row.kind === 'feed' ? 'suggested' : 'none';
  P.reply.classList.toggle('hide', mode !== 'reply');
  P.deeper.classList.toggle('hide', mode !== 'deeper');
  P.suggested.classList.toggle('hide', mode !== 'suggested');
  if (mode === 'reply') P.input.placeholder = state.replies[row.i] ? 'Replied. Say more...' : 'Reply to sam...';
}

// What the handwriting beside the phone says for the reel on screen.
function prompt() {
  const { r, c } = T.pos, row = rows[r];
  if (row.kind === 'end') return "That's all four from Sam. Keep watching for your usual feed, or head back to the chat.";
  if (row.kind === 'feed') return c === 0 ? 'Now it behaves like your normal feed. Sideways still goes deeper.' : 'Up and down moves across topics. Sideways stays on one.';
  if (c > 0) return c === 1 && !state.wentDeeper ? "You're one level deeper: more like Sam's reel. Swipe right to get back to Sam." : 'Keep going deeper, or swipe right to get back to Sam.';
  if (row.i === 0) return "Sam's message comes with the reel. React or reply right here, then swipe up.";
  if (!state.peeked) return 'Like this one? Swipe left to see more like it.';
  return state.replies[row.i] ? 'Sent. Swipe up for the next one.' : `Reel ${row.i + 1} of 4. Reply, or keep swiping up.`;
}
function onSettle() {
  const { r, c } = T.pos, row = rows[r];
  if (row.kind === 'end') { T.cur.remove(); T.cur = card(r, 0); P.track.appendChild(T.cur); } // refresh the reply count
  T.cur.classList.add('active');
  playCard(T.cur);
  updateChrome();
  say(prompt());
  if (row.kind === 'sam' && c > 0) state.wentDeeper = true;
  clearTimeout(state.peekT);
  if (row.kind === 'sam' && c === 0 && row.i >= 1 && !state.peeked)
    state.peekT = setTimeout(() => { state.peeked = true; peek(); }, 1600);
}

function sendReply(val, type, src) {
  const row = rows[T.pos.r]; if (row.kind !== 'sam') return;
  state.replies[row.i] = { val, type };
  // The reply travels up to Sam's face in the header.
  const pr = P.el.getBoundingClientRect(), b = src.getBoundingClientRect(), face = P.face.getBoundingClientRect();
  const x = b.left - pr.left + b.width / 2, y = b.top - pr.top + b.height / 2;
  const tx = face.left - pr.left + face.width / 2 - x, ty = face.top - pr.top + face.height / 2 - y;
  if (type === 'react') {
    for (let k = 0; k < 7; k++) {
      const s = h('span', 'fx', val); s.style.left = x + 'px'; s.style.top = y + 'px'; P.el.appendChild(s);
      const main = k === 0, ang = -Math.PI / 2 + (k - 3.5) * 0.42, dist = 70 + Math.random() * 50;
      const ex = main ? tx : Math.cos(ang) * dist, ey = main ? ty : Math.sin(ang) * dist - 20;
      s.animate([
        { transform: 'translate(-50%,-50%) scale(.6)', opacity: 1 },
        { transform: `translate(calc(-50% + ${ex * (main ? 0.15 : 0.7)}px),calc(-50% + ${ey * (main ? 0.15 : 0.7) - (main ? 60 : 0)}px)) scale(${main ? 2.4 : 1.1})`, opacity: 1, offset: 0.4 },
        { transform: `translate(calc(-50% + ${ex}px),calc(-50% + ${ey}px)) scale(${main ? 0.3 : 0.5})`, opacity: main ? 0.9 : 0 }
      ], { duration: reduce ? 1 : main ? 900 : 650 + k * 30, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => s.remove();
    }
  } else {
    const f = h('div', 'fly'); f.textContent = val; P.el.appendChild(f);
    const fw = f.offsetWidth, fh = f.offsetHeight;
    const sx = b.left - pr.left, sy = b.top - pr.top + b.height / 2 - fh / 2;
    f.style.left = sx + 'px'; f.style.top = sy + 'px';
    const fx = face.left - pr.left + face.width / 2 - sx - fw / 2, fy = face.top - pr.top + face.height / 2 - sy - fh / 2;
    f.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${fx * 0.2}px,-90px) scale(1.05)`, opacity: 1, offset: 0.35 }, { transform: `translate(${fx}px,${fy}px) scale(.15)`, opacity: 0.3 }],
      { duration: reduce ? 1 : 800, easing: 'cubic-bezier(.3,.7,.3,1)' }).onfinish = () => f.remove();
  }
  // Sam's avatar gives a small bounce when the reply lands.
  if (!reduce) P.face.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)', offset: 0.4 }, { transform: 'scale(1)' }], { duration: 420, delay: type === 'react' ? 820 : 720, easing: 'cubic-bezier(.2,1.5,.4,1)' });
  setTimeout(() => { if (P) { updateChrome(); say(prompt()); } }, reduce ? 0 : 700);
}

/* ---------- Start ---------- */
screen.appendChild(narrow ? introView() : inboxView());
</script>
</body>
</html>
