html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;

a{color:inherit}

/* workbench: a cutting mat with a few tools at its edges; the tools step aside on smaller screens */
#desk{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#desk .mat{position:absolute;inset:0;background:
  linear-gradient(var(--mat-major) 1px,transparent 1px) 0 0/100px 100px,
  linear-gradient(90deg,var(--mat-major) 1px,transparent 1px) 0 0/100px 100px,
  linear-gradient(var(--mat-line) 1px,transparent 1px) 0 0/20px 20px,
  linear-gradient(90deg,var(--mat-line) 1px,transparent 1px) 0 0/20px 20px,
  var(--mat);transition:background-color .4s}
#desk .mat::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(45deg,transparent calc(50% - .5px),var(--mat-line) calc(50% - .5px),var(--mat-line) calc(50% + .5px),transparent calc(50% + .5px)) 0 0/400px 400px;opacity:.9}
.mat-n{position:absolute;font-family:var(--mono);font-size:8px;letter-spacing:.06em;color:var(--mat-ink)}
.mat-n.top{left:0;right:0;top:4px;height:10px;background:repeating-linear-gradient(90deg,var(--mat-ink) 0 1px,transparent 1px 20px) 0 0/100% 4px no-repeat}
.mat-n.left{top:0;bottom:0;left:4px;width:10px;background:repeating-linear-gradient(var(--mat-ink) 0 1px,transparent 1px 20px) 0 0/4px 100% no-repeat}
.tool{position:absolute;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18)) drop-shadow(0 1px 1px rgba(0,0,0,.2));transition:opacity .4s}
.tool.pencil{width:300px;right:200px;top:24px;transform:rotate(-4deg)}
.tool.knife{width:200px;left:-96px;bottom:70px;transform:rotate(-22deg) scaleX(-1)}
.tool.ruler{width:44px;height:520px;left:28px;top:50%;margin-top:-330px;transform:rotate(3deg);border-radius:3px;
  background:repeating-linear-gradient(transparent 0 9px,rgba(0,0,0,.45) 9px 10px) right 0 top 10px/9px 100% no-repeat,
  repeating-linear-gradient(transparent 0 49px,rgba(0,0,0,.55) 49px 50px) right 0 top 10px/16px 100% no-repeat,
  linear-gradient(90deg,#c9c9c9,#f4f4f4 35%,#dedede 70%,#bdbdbd)}
.tool.ruler b{position:absolute;right:18px;font:500 8px/1 var(--mono);color:rgba(0,0,0,.6);transform:rotate(90deg)}
.tool.ruler i{position:absolute;left:8px;top:20px;width:6px;height:6px;border-radius:50%;background:#9a9a9a;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tool{opacity:.55}}
:root[data-theme="dark"] .tool{opacity:.55}
@media (max-width:1180px),(max-height:700px){.tool{opacity:0!important}}
.tool.tucked{opacity:0!important}
/* the desk is a wood table spanning the whole window; at night it's lit by a desk lamp */
:root[data-desk="wood"] #desk .mat{inset:0;border-radius:0;box-shadow:none}
:root[data-desk="wood"]{--mat-ink:rgba(255,255,255,.55);--drop:0 30px 60px rgba(0,0,0,.5)}
:root[data-desk="wood"] #desk .mat{background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.45)),url(assets/images/desk/wood.jpg) center/cover #2a1a10}
:root[data-desk="wood"] #desk .mat::before,[data-desk="wood"] .mat-n{display:none}
[data-desk="wood"] .tool{filter:drop-shadow(0 8px 8px rgba(0,0,0,.45)) drop-shadow(0 1px 1px rgba(0,0,0,.4))}
/* the table at night: the wood sinks into the dark, with a warm pool of lamplight where the book sits */
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"])[data-desk="wood"] #desk .mat{background:radial-gradient(ellipse 60% 70% at 50% 46%,rgba(255,176,96,.16),rgba(255,150,70,.05) 45%,transparent 70%),radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.75)),linear-gradient(rgba(8,5,3,.5),rgba(8,5,3,.5)),url(assets/images/desk/wood.jpg) center/cover #120b07}
:root:not([data-theme="light"])[data-desk="wood"]{--drop:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.04)}

:root[data-theme="dark"][data-desk="wood"]{--drop:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.04)}

/* things that sit straight on the desk stay readable on the darker surfaces */
[data-desk="wood"] #hint,[data-desk="wood"] #toggles .tg,[data-desk="wood"] #hint button,[data-desk="wood"] #hint span{color:rgba(255,255,255,.85)}
[data-desk="wood"] #hint{text-shadow:0 1px 3px rgba(0,0,0,.55)}
/* on wood, hover brightens to white on a soft light wash (dark ink would sink into the grain) */
[data-desk="wood"] #hint button:hover,[data-desk="wood"] #hint button:focus-visible,[data-desk="wood"] #toggles .tg:hover,[data-desk="wood"] #toggles .tg:focus-visible,[data-desk="wood"] #hint .riffbtn.on{color:#fff;background:rgba(255,255,255,.14)}
[data-desk="wood"] .bookbg{box-shadow:var(--stack),var(--drop)}
/* closed, the paper block wears the cover's colour and corners so nothing pale peeks out around the board */
#bookbg.shut{background:var(--cover);border-radius:6px 14px 14px 6px;box-shadow:0 1px 1px rgba(0,0,0,.3),var(--drop)}
#stage{position:absolute;inset:0 0 auto 0;display:flex;align-items:safe center;justify-content:safe center}
.flipwrap{position:fixed;z-index:15;pointer-events:none}
.flipcard{position:absolute;inset:0;transform-style:preserve-3d}
.fside{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.fface{position:absolute;left:0;top:0;transform-origin:0 0}
.fedge{position:absolute;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fedge.spine{background:linear-gradient(90deg,var(--cover),color-mix(in srgb,var(--cover) 78%,#fff) 50%,var(--cover));border-radius:8px}
.fedge.pages{background:linear-gradient(90deg,var(--cover) 0 2px,transparent 2px calc(100% - 2px),var(--cover) calc(100% - 2px)),repeating-linear-gradient(90deg,var(--page) 0 1.6px,color-mix(in srgb,var(--ink) 22%,var(--page)) 1.6px 2.2px)}
#stage.zoomed{overflow:auto;overscroll-behavior:contain}
#stage.zoomed #box{margin:16px 16px 72px}
/* zoomed scrollbars: a hairline pill with no track, invisible until you scroll or hover, like macOS overlay bars */
#stage.zoomed::-webkit-scrollbar{width:10px;height:10px;background:transparent}
#stage.zoomed::-webkit-scrollbar-track,#stage.zoomed::-webkit-scrollbar-corner,#stage.zoomed::-webkit-scrollbar-button{background:transparent;display:none}
#stage.zoomed::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;background-clip:padding-box;border-radius:10px}
#stage.zoomed.scrolling::-webkit-scrollbar-thumb,#stage.zoomed:hover::-webkit-scrollbar-thumb{background-color:rgba(128,128,128,.55)}
#stage.zoomed::-webkit-scrollbar-thumb:hover{background-color:rgba(128,128,128,.85)}
@supports not selector(::-webkit-scrollbar){#stage.zoomed{scrollbar-width:thin;scrollbar-color:transparent transparent;transition:scrollbar-color .3s}#stage.zoomed.scrolling,#stage.zoomed:hover{scrollbar-color:rgba(128,128,128,.55) transparent}}
#box{position:relative}
#fit{position:absolute;left:0;top:0;transform-origin:0 0}
.book{position:absolute;perspective:2600px;touch-action:none;user-select:none;-webkit-user-select:none}
.openshade{position:absolute;top:0;bottom:0;border-radius:6px;box-shadow:var(--shadow);pointer-events:none;display:none}
.bookbg{position:absolute;top:0;bottom:0;right:0;border-radius:6px;box-shadow:var(--shadow);background:var(--page)}
.slot{position:absolute;top:0;bottom:0;z-index:1}
.pg{position:absolute;inset:0;background-color:var(--page);
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;overflow:hidden;color:var(--ink);transition:background-color .4s}
.pg.left{border-radius:6px 0 0 6px}.pg.right{border-radius:0 6px 6px 0}.pg.single{border-radius:6px 10px 10px 6px}
.pg.left::after,.pg.right::after,.pg.single::after{content:"";position:absolute;top:0;bottom:0;width:46px;pointer-events:none}
.pg.left::after{right:0;background:linear-gradient(90deg,transparent,var(--spine))}
.pg.right::after{left:0;background:linear-gradient(270deg,transparent,var(--spine))}
.pg.single::after{left:0;width:22px;background:linear-gradient(270deg,transparent,var(--spine))}
.pc{position:absolute;inset:0;padding:42px 46px 46px;display:flex;flex-direction:column;gap:22px}
.single .pc{padding:30px 26px 40px;gap:18px}
.pfoot{position:absolute;bottom:18px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.left .pfoot{left:46px}.right .pfoot{right:46px}.single .pfoot{left:26px}

.leaf,.cover{position:absolute;top:0;bottom:0;transform-style:preserve-3d;will-change:transform;z-index:5}
.cover{z-index:6;cursor:pointer}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.08));opacity:0;z-index:4}

.cv{position:absolute;inset:0;background:var(--cover);border-radius:6px 14px 14px 6px;overflow:hidden;transition:background-color .4s}
.cv .label,.cv .doodle,.cv .fstk{z-index:2}
.cv .label::before{content:"";position:absolute;right:-14px;top:-8px;width:56px;height:18px;background:rgba(235,235,225,.5);transform:rotate(32deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.cv .fstk{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 3px #FFFFFF,0 3px 8px rgba(0,0,0,.45);font-family:var(--mono);font-weight:500;letter-spacing:.1em;line-height:1.15}
.cv .fstk.a{left:300px;top:70px;width:92px;height:92px;border-radius:50%;background:#EDEDED;color:#171717;font-size:9px;transform:rotate(12deg)}
.cv .fstk.a b{display:block;font:600 23px/1 var(--hand);letter-spacing:0;margin:2px 0;-webkit-text-stroke:.02em currentColor}
/* personal bits: a taped photo and gel-pen notes written straight onto the board */
.cv .cvphoto{position:absolute;left:66px;top:46px;z-index:2;width:104px;padding:8px 8px 22px;box-sizing:border-box;background:#F7F7F5;transform:rotate(-7deg);box-shadow:0 3px 8px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center}
.cv .cvphoto img{width:88px;height:88px;object-fit:cover;display:block;filter:grayscale(.2) contrast(1.05)}
.cv .cvphoto .tape{position:absolute;top:-9px;left:28px;width:48px;height:18px;background:rgba(235,235,225,.55);transform:rotate(4deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.cv .gel{color:rgba(255,255,255,.78);z-index:2;-webkit-text-stroke:.02em currentColor}
.cv .route{position:absolute;right:62px;bottom:150px;width:220px;height:132px;overflow:visible}
.cv .route .trail{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 5;stroke-linecap:round}
.cv .route circle,.cv .route path:not(.trail){fill:currentColor}
.cv .route text{fill:currentColor;font:600 15px var(--hand)}
.cv .iffound{position:absolute;right:58px;bottom:34px;margin:0;width:250px;text-align:right;transform:rotate(-3deg);font:600 13px/1.2 var(--hand)}
.single .cv .route{right:40px;bottom:112px;transform:scale(.72);transform-origin:100% 100%}
/* closed, the pages underneath take the cover's rounded corners so none of their white shows past it */
.book.shut .slot{clip-path:inset(0 round 6px 14px 14px 6px);opacity:0}
#bookbg.shut.back{border-radius:14px 6px 6px 14px}.book.shut.back .slot{clip-path:inset(0 round 14px 6px 6px 14px)}
.cv .spine{position:absolute;left:0;top:0;bottom:0;width:20px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(0,0,0,.4) 70%,rgba(255,255,255,.03))}
.cv .band{position:absolute;right:46px;top:0;bottom:0;width:10px;background:var(--cover-band);box-shadow:inset 1px 0 0 rgba(255,255,255,.07)}
.cv .label{position:absolute;left:84px;top:220px;width:272px;height:140px;background:var(--label);border-radius:4px;padding:16px 18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;color:var(--label-ink)}
.cv .label small{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#6B6B6B}
.sigline{height:62px;border-bottom:1px solid #A9A9A9;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.sig{font-family:var(--hand);font-weight:600;font-size:38px;white-space:nowrap;line-height:1;color:#171717;clip-path:inset(0 100% 0 0);display:inline-block;padding:0 10px 0 6px}
.signed .sig{clip-path:inset(0 0 0 0)}
.cv .doodle{position:absolute;left:84px;bottom:56px;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
/* a rubber stamp pressed into the stencil: a little robot waving hi */
.stamp{width:112px;height:112px;color:#EDEDED;opacity:.85;transform:rotate(-8deg) translate(2px,-1px);overflow:visible}
.stamp text{fill:currentColor;stroke:none}
.stamp .hi{font-family:var(--hand);font-size:16px;font-weight:600}
.stamp .arm{transform-box:fill-box;transform-origin:0% 100%}

/* the sticky-note agent: it rests on the desk, or sticks to a page and turns with it */
.agent{position:fixed;left:0;top:0;z-index:12;width:136px;height:116px;transform-origin:0 0;touch-action:none}

  box-shadow:0 6px 14px rgba(0,0,0,.16);transition:transform .35s cubic-bezier(.3,.7,.2,1),box-shadow .35s;cursor:var(--cur-turn,grab)}
.ag-mini::before{content:"";position:absolute;left:44px;top:-9px;width:50px;height:18px;background:var(--tape);transform:rotate(3deg)}

.ag-mini:hover .ag-ask,.ag-mini:focus-visible .ag-ask{opacity:.9}
@keyframes nb-wiggle{0%,100%{rotate:0deg}20%{rotate:-2.5deg}40%{rotate:2deg}60%{rotate:-1.2deg}80%{rotate:.6deg}}
.nudge{animation:nb-wiggle .9s ease-in-out 1}
@media (prefers-reduced-motion:reduce){.nudge{animation:none}}

.ag-sugg button:hover{opacity:1;background:rgba(0,0,0,.04)}
.ag-form{display:flex;gap:8px;align-items:flex-end;border-bottom:1.5px solid currentColor;padding-bottom:2px}

/* answers stuck onto a page */
.pin{overflow-wrap:anywhere;position:absolute;z-index:2;cursor:var(--cur-turn,grab);touch-action:none;width:150px;background:var(--sticky);color:var(--sticky-ink);font-family:var(--hand);font-size:17px;line-height:1.1;padding:12px 12px 10px;box-sizing:border-box;box-shadow:0 5px 12px rgba(0,0,0,.14)}

.pin .unpin:hover{opacity:1}

/* a letter tucked into a pocket on the journal page */
.pocketwrap{position:relative;margin-top:auto;height:236px}
.tucked{position:absolute;left:9%;right:9%;top:0;height:210px;background:var(--page);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.1);

  clip-path:polygon(0 0,38% 0,50% 16px,62% 0,100% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;box-sizing:border-box}

#letterDim{position:fixed;inset:0;z-index:28;background:rgba(0,0,0,.5);opacity:0;transition:opacity .45s}

.lt-panel{position:absolute;left:0;width:100%;transform-style:preserve-3d;transform-origin:50% 0}
.lt-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--page)}
.lt-face.back{transform:rotateX(180deg);background:linear-gradient(180deg,var(--page),var(--pocket))}
.lt-face .crease{position:absolute;left:0;right:0;height:10px;pointer-events:none}

.lt-sheet{position:absolute;inset:0;background:var(--page);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.lt-body{padding:44px clamp(22px,7%,64px) 64px;display:flex;flex-direction:column;gap:16px;color:var(--ink);box-sizing:border-box;
  background-image:linear-gradient(transparent calc(33.333% - 1px),rgba(0,0,0,.05) calc(33.333% - 1px),rgba(0,0,0,.05) 33.333%,transparent 33.333%,transparent calc(66.666% - 1px),rgba(0,0,0,.05) calc(66.666% - 1px),rgba(0,0,0,.05) 66.666%,transparent 66.666%)}
.lt-body h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lt-body p{font-size:16px;line-height:1.68;margin:0;max-width:62ch}
.lt-body .refs{margin:0;padding-left:20px;font-size:12.5px;line-height:1.55;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.lt-body .refs a{color:inherit}
.lt-body .ph{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.lt-close{position:absolute;right:8px;top:8px;z-index:2;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:300;line-height:1;color:var(--muted);background:none;border:0;border-radius:50%;transition:color .2s,transform .2s}
.lt-close:hover,.lt-close:focus-visible{color:var(--ink);transform:rotate(90deg)}

.lt-sheet::-webkit-scrollbar{width:5px}.lt-sheet::-webkit-scrollbar-track{background:transparent}.lt-sheet::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.lt-sheet:hover::-webkit-scrollbar-thumb{background:var(--faint)}

/* copy-link on page titles: a pencil link icon fades in on hover; click copies the page's address and pencils a check */
.cplink{position:relative;display:inline-block;width:0;height:1em;padding:0;margin:0;border:0;background:none;color:var(--muted);font:inherit;vertical-align:baseline;cursor:pointer}
.cplink .cpi{position:absolute;left:.32em;top:50%;transform:translateY(-32%);display:flex;align-items:center;gap:5px;padding:4px;margin:-4px;opacity:0;transition:opacity .25s,color .2s;white-space:nowrap}
.cplink .cpi::after{content:'copied';font-family:var(--hand);font-size:.68em;font-weight:400;letter-spacing:0;color:var(--pen);-webkit-text-stroke:.022em currentColor;transform:rotate(-4deg);clip-path:inset(0 100% 0 0)}
.cplink svg{width:.8em;height:.8em;flex:none;overflow:visible}
.cplink .ok{display:none}
.mail .cplink{font-size:16px}
.mail .cplink .cpi{top:calc(50% + 4px)}
:is(h1,h2):hover>.cplink .cpi,.mail:hover>.cplink .cpi,.cplink:focus-visible .cpi,.cplink.done .cpi{opacity:1}
.cplink:hover .cpi{color:var(--ink)}
@media (hover:none){.cplink .cpi{opacity:.45}}
.cplink.done .lk{display:none}.cplink.done .ok{display:block;color:var(--pen)}
.cplink.done .ok path{stroke-dasharray:100;stroke-dashoffset:100;animation:cpdraw .42s cubic-bezier(.4,.1,.3,1) forwards}
.cplink.done .cpi::after{animation:cpwrite .55s steps(9) .28s forwards}
/* after "copied", everything fades away; the icon stays hidden until the pointer leaves the title */
.cplink.done.out .cpi{opacity:0;transition:opacity .5s}
.cplink.rest .cpi{opacity:0!important}
@keyframes cpdraw{to{stroke-dashoffset:0}}
@keyframes cpwrite{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.cplink.done .ok path{animation:none;stroke-dashoffset:0}.cplink.done .cpi::after{animation:none;clip-path:none}}
.tttwrap{position:absolute;right:24px;bottom:62px;display:flex;flex-direction:row-reverse;align-items:center;gap:10px;opacity:.5;transition:opacity .3s;z-index:1}

/* the glance page keeps its bottom strip clear for the tic-tac-toe (and, on laptops, the sticky note); the page fit shrinks text rather than letting it run under them */
.pc:has(> .tttwrap){padding-bottom:150px}
.single .pc:has(> .tttwrap){padding-bottom:128px}
/* on phones the sticky note starts at the bottom of the first page, so the featured page leaves it room */

@keyframes tdraw{to{stroke-dashoffset:0}}

/* a page that holds more than fits (mostly on phones) is shrunk just enough to show all of it */
var FIT = {};
function fitCSS(f){ return 'right:auto;bottom:auto;box-sizing:border-box;width:' + (PW / f).toFixed(1) + 'px;height:' + (PH / f).toFixed(1) + 'px;transform:scale(' + f.toFixed(4) + ');transform-origin:0 0'; }
/* how tall the page's content wants to be, bottom padding included (scrollHeight misses content that spills into the padding) */
function fitNeed(pc){
  var b = 0;
  for(var c = pc.firstElementChild; c; c = c.nextElementSibling) if(getComputedStyle(c).position !== 'absolute') b = Math.max(b, c.offsetTop + c.offsetHeight);
  return b + parseFloat(getComputedStyle(pc).paddingBottom);
}
function computeFits(){
  FIT = {};
  var probe = document.createElement('div');
  probe.className = 'book ' + mode; probe.setAttribute('aria-hidden', 'true');
  probe.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;width:' + PW + 'px;height:' + PH + 'px';
  document.body.appendChild(probe);
  for(var i = 0; i < N; i++){
    probe.innerHTML = pageHTML(i, mode === 'spread' ? (i % 2 ? 'right' : 'left') : 'single');
    var pc = probe.querySelector('.pc');
    if(fitNeed(pc) <= pc.clientHeight + 1) continue;
    // shrinking widens the lines, so text re-wraps shorter: search for the largest scale that still fits instead of guessing once
    var lo = .62, hi = 1;
    pc.style.cssText = fitCSS(lo);
    if(fitNeed(pc) <= pc.clientHeight + 1){
      for(var k = 0; k < 8; k++){
        var mid = (lo + hi) / 2; pc.style.cssText = fitCSS(mid);
        if(fitNeed(pc) <= pc.clientHeight + 1) lo = mid; else hi = mid;
      }
    }
    FIT[i] = lo;
  }
  probe.remove();
}
function pageHTML(i, side){
  if(i < 0 || i >= N) return '<div class="pg '+side+'"></div>';
  var p = PAGES[i], parts = ornsOut((typeof stickyIds === 'function' ? stickyIds(p.html, i) : p.html).replace('<!--TTT-->', typeof tttHTML === 'function' ? tttHTML() : ''));
  return '<div class="pg '+side+'"><div class="pc"'+(FIT[i] ? ' style="'+fitCSS(FIT[i])+'"' : '')+'>'+parts[0]+'</div>'+parts[1]+(typeof pinsHTML === 'function' ? pinsHTML(i) + agPageHTML(i) : '')+(p.num===false?'':'<div class="pfoot">p. '+(i+1)+'</div>')+'</div>';
}
function lastPos(){ return mode === 'spread' ? Math.ceil(N/2) - 1 : N - 1; }
function currentChapter(){ var i = mode === 'spread' ? 2*pos + 1 : pos; i = Math.min(i, N-1); return PAGES[i].ch; }

function render(){
  if(mode === 'spread'){ L.innerHTML = pageHTML(2*pos, 'left'); R.innerHTML = pageHTML(2*pos+1, 'right'); }
  else { R.innerHTML = pageHTML(pos, 'single'); L.innerHTML = ''; }
  leaf.hidden = true; leaf.innerHTML = ''; leaf.style.transform = ''; leaf.style.opacity = '';
  book.classList.remove('turning');
  cNext.hidden = closed || backClosed;
  cPrev.hidden = closed || backClosed || mode === 'single';
  tabsEl.style.visibility = backClosed ? 'hidden' : '';
  renderTabs(); updateBar(); mountVideos();
  if(mode === 'spread'){ warmPage(2 * pos + 2); warmPage(2 * pos + 3); }
  else warmPage(pos + 1);
  if(typeof paintAgent === 'function' && agent) paintAgent();
  if(typeof paintSkills === 'function') paintSkills();
  syncURL();
}
/* keep the address bar on the page being read, so copying it shares that page (the first spread stays plain "/") */
function syncURL(){
  if(!urlReady || !window.history || !history.replaceState || !/^https?:/.test(location.protocol)) return;
  var s = '';
  if(backClosed) s = linkSlug;
  else if(!closed){
    var ids = (mode === 'spread' ? [2 * pos, 2 * pos + 1] : [pos]).filter(function(i){ return i >= 0 && i < N; }).map(function(i){ return PAGES[i].id; });
    // the linked page if it's still open, else a section's first page if one is showing, else the left page
    var starts = ids.filter(function(id){ return CHAPTERS.some(function(c){ return c.first === id; }); });
    s = ids.indexOf(linkSlug) >= 0 ? linkSlug : starts.length ? starts[0] : ids[0];
  }
  if(s === 'profile') s = '';
  linkSlug = s;
  if(location.pathname !== '/' + s) history.replaceState(null, '', '/' + s + location.search + location.hash);
}
function warmPage(i){
  if(i < 0 || i >= N) return;
  (PAGES[i].html || '').replace(/src="(assets\/[^"]+)"/g, function(_, u){ var im = new Image(); im.src = u; });
}
function attachFileVideo(v){
  if(v.querySelector('video')) return;
  var el = document.createElement('video');
  el.muted = true; el.loop = true; el.playsInline = true; el.preload = 'auto';
  el.setAttribute('aria-label', 'Demo video'); el.src = v.dataset.file;
  /* keep the still up until the first video frame has really been painted, so there is never a black flash in between */
  var shown = false, show = function(){ if(!shown){ shown = true; v.classList.add('live'); } };
  if(el.requestVideoFrameCallback) el.requestVideoFrameCallback(show);
  else el.addEventListener('timeupdate', function tu(){ if(el.currentTime > .05){ el.removeEventListener('timeupdate', tu); show(); } });
  el.addEventListener('playing', function(){ setTimeout(show, 900); });
  v.appendChild(el);
  if(RM){ el.controls = true; v.classList.add('live'); } else { var pr = el.play(); if(pr && pr.catch) pr.catch(function(){}); }
}
function mountVideos(){

    v.classList.add('on');
    var go = function(){ setTimeout(function(){ attachFileVideo(v); }, i * 280); };
    var img = v.querySelector('img');
    if(img && !img.complete) img.addEventListener('load', go, { once:true });

  });
  if(!RM) slot.querySelectorAll('.vid[data-yt]:not(.on)').forEach(function(v){
    var id = v.dataset.yt, f = document.createElement('iframe');
    v.classList.add('on'); f.title = 'Demo video'; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.allow = 'autoplay; encrypted-media';
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&loop=1&playlist=' + id + '&controls=0&rel=0&playsinline=1&iv_load_policy=3&disablekb=1&fs=0&modestbranding=1&cc_load_policy=0';
    /* keep the still over the player until YouTube's title card has faded */

    var f = document.createElement('iframe');
    v.classList.add('on', 'live'); f.title = 'Embedded media'; f.src = v.dataset.src; f.setAttribute('scrolling', 'no');
    f.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture'; f.loading = 'lazy';
    v.appendChild(f);
  }); });
}

var LDIM = '';
function viewDims(){ return window.innerWidth + 'x' + window.innerHeight + 'x' + document.body.clientWidth; }
/* a desk object never sits under the book: anything the open spread (tabs and page count included) would cover is tucked away */

  if(mode !== 'spread') return;
  var bx = $('box').getBoundingClientRect(), s = scale, pad = 10;
  var L0 = bx.left + 55 * s, T0 = bx.top + parseFloat(book.style.top) * s, W = BW * s, H = PH * s;
  var areas = [[L0, T0, L0 + W, T0 + H + 44 * s], [L0 + W, T0 + 40 * s, L0 + W + 80 * s, T0 + 560 * s]];   // the open pages (with the page count under them), then the tabs
  document.querySelectorAll('#desk .tool').forEach(function(t){
    t.classList.remove('tucked'); var r = t.getBoundingClientRect();
    var hit = areas.some(function(a){ return r.right > a[0] - pad && r.left < a[2] + pad && r.bottom > a[1] - pad && r.top < a[3] + pad; });
    t.classList.toggle('tucked', hit);

}

  else { L.style.width = '0px'; R.style.left = '0px'; R.style.width = PW + 'px'; }

  lab.style.width = (mode === 'spread' ? 272 : 250) + 'px';

  cover.querySelector('.band').style.right = (mode === 'spread' ? 46 : 34) + 'px';
  backBoard.style.width = PW + 'px'; backBoard.style.transformOrigin = mode === 'spread' ? 'left center' : 'right center';

  else { bbF.innerHTML = ext; bbB.innerHTML = '<div class="pg single"></div>'; }

  if(stk){ stk.style.transform = 'scale(' + k + ')'; stk.style.left = ((PW - 520 * k) / 2) + 'px'; stk.style.top = ((PH - 660 * k) / 2) + 'px'; }

/* ---------- cover ---------- */
var oshade = $('oshade');
/* the open book sits a little heavier on the desk than the closed one. That extra shadow fades in
   with the cover, so it reaches full strength exactly as the cover lands */
function shadeSide(o){
  o = Math.max(0, Math.min(1, o));
  oshade.style.display = o > .001 ? 'block' : 'none';
  oshade.style.opacity = String(o);
  oshade.style.left = bookbg.style.left || '0px'; oshade.style.right = bookbg.style.right || '0px';
}
function applyCover(p){
  cover.hidden = p >= 1;
  // closed, or only lifted by a hover: the paper stays hidden behind the board, so no white edge shows around it
  bookbg.classList.toggle('shut', p <= .1); book.classList.toggle('shut', p <= .1); bookbg.classList.remove('back'); book.classList.remove('back');
  cover.style.transform = 'rotateY(' + (-180 * p) + 'deg)';
  cover.firstElementChild.style.visibility = p < .5 ? 'visible' : 'hidden';
  coverB.style.visibility = p < .5 ? 'hidden' : 'visible';
  $('coverShadeF').style.opacity = String(Math.min(1, p * 2) * .45);
  if(mode === 'spread'){
    book.style.transform = 'translateX(' + (-PW / 2 * (1 - p)) + 'px)';
    L.style.visibility = p >= 1 ? 'visible' : 'hidden';
    // one block of paper, one shadow: its left edge follows the cover out across the desk, so the shadow grows evenly
    bookbg.style.left = (p >= 1 ? 0 : PW - PW * Math.max(0, -Math.cos(Math.PI * p))) + 'px';
    shadeSide(p);
    cover.style.opacity = '';
  } else {
    book.style.transform = '';
    bookbg.style.left = '0px'; shadeSide(p);
    cover.style.opacity = String(p < .55 ? 1 : Math.max(0, 1 - (p - .55) / .45));
  }
}
function tween(fn, from, to, dur, snappy){
  return new Promise(function(res){
    if(RM || dur <= 1){ fn(to); res(); return; }
    var t0 = performance.now();
    function f(now){
      var k = Math.min(1, (now - t0) / dur);
      // snappy: moves the moment you press and settles at the end (page turns); otherwise a gentle ease in and out
      var e = snappy ? 1 - Math.pow(1 - k, 2.4) : k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
      fn(from + (to - from) * e);
      if(k < 1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, RM ? 0 : ms); }); }

    signed = true; store('nb-signed', '1'); $('label').classList.add('signed'); sig.style.clipPath = '';
  });
}

/* ---------- page turns ---------- */
/* A page is cut into vertical strips that each rotate a little more than the last,
   so the sheet bends as it turns. The cover is board, so it stays stiff. */
var CURL = { strips: 16, bend: 62, lift: 0.6 };
function buildCurl(frontHTML, backHTML, side, n){
  var sw = PW / n, strips = [], fronts = [], backs = [], fsh = [], bsh = [];
  var parent = leaf;
  for(var i = 0; i < n; i++){
    var st = document.createElement('div'); st.className = 'strip';
    st.style.width = (sw + 1) + 'px';
    if(side === 'r'){ st.style.left = (i === 0 ? 0 : sw) + 'px'; st.style.transformOrigin = 'left center'; }
    else { st.style.left = (i === 0 ? PW - sw : -sw) + 'px'; st.style.transformOrigin = (i === 0 ? sw : sw) + 'px 50%'; }
    var fOff = side === 'r' ? -i * sw : -(PW - (i + 1) * sw);
    var bOff = side === 'r' ? -(PW - (i + 1) * sw) : -i * sw;
    var f = document.createElement('div'); f.className = 'sface front';
    f.innerHTML = '<div class="inner" style="left:' + fOff + 'px;width:' + PW + 'px">' + frontHTML + '</div><div class="sshade"></div>';
    var bk = document.createElement('div'); bk.className = 'sface back';
    bk.innerHTML = '<div class="inner" style="left:' + bOff + 'px;width:' + PW + 'px">' + backHTML + '</div><div class="sshade"></div>';
    st.appendChild(f); st.appendChild(bk); parent.appendChild(st); parent = st;
    strips.push(st); fronts.push(f); backs.push(bk); fsh.push(f.lastChild); bsh.push(bk.lastChild);
  }
  // weights grow toward the free edge, so the corner leads and the spine follows
  var w = [], tot = 0; for(var k = 1; k < n; k++){ var v = Math.pow(k / n, 1.6); w.push(v); tot += v; }
  w = w.map(function(v){ return v / tot; });
  var up = [], sh = [];
  return function(p){
    var sgn = side === 'r' ? -1 : 1;
    var base = 180 * p * sgn;
    var bend = Math.sin(Math.PI * p) * CURL.bend * sgn;
    var cum = base, prev = base;
    for(var i = 0; i < n; i++){
      if(i === 0){ strips[0].style.transform = 'rotateY(' + base + 'deg) translateZ(' + (CURL.lift * Math.sin(Math.PI * p)) + 'px)'; }
      else {
        var target = cum + bend * w[i - 1];
        target = sgn < 0 ? Math.max(-180, target) : Math.min(180, target);
        var d = target - cum; cum = target;
        strips[i].style.transform = 'rotateY(' + d + 'deg)';
      }
      var a = Math.abs(cum) * Math.PI / 180;
      var frontUp = Math.abs(cum) < 90;
      // only touch a face when it actually flips: a visibility change restyles the whole copied page inside it
      if(up[i] !== frontUp){
        up[i] = frontUp;
        fronts[i].style.visibility = frontUp ? 'visible' : 'hidden';
        backs[i].style.visibility = frontUp ? 'hidden' : 'visible';
      }
      var shade = Math.round(Math.sin(a) * 100) / 100;
      if(sh[i] !== shade){ sh[i] = shade; fsh[i].style.opacity = String(shade * .28); bsh[i].style.opacity = String(shade * .22); }
    }
  };
}
function setupTurn(dir, target){
  if(closed) return null;
  var last = lastPos();
  if(target === undefined) target = pos + dir;
  if(target > last || target < 0 || target === pos) return null;
  dir = target > pos ? 1 : -1;
  leaf.innerHTML = ''; leaf.hidden = false; leaf.style.opacity = '';
  book.classList.add('turning');
  if(typeof closeAgent === 'function' && agOpen) closeAgent();
  leaf.style.width = PW + 'px'; leaf.style.transform = '';
  var n = mode === 'spread' ? CURL.strips : Math.round(CURL.strips * .75);
  var bend, apply, castSide;
  if(mode === 'spread'){
    if(dir > 0){
      leaf.style.left = PW + 'px';
      bend = buildCurl(pageHTML(2*pos+1, 'right'), pageHTML(2*target, 'left'), 'r', n);
      R.innerHTML = pageHTML(2*target+1, 'right'); castSide = 'r';
    } else {
      leaf.style.left = '0px';
      bend = buildCurl(pageHTML(2*pos, 'left'), pageHTML(2*target+1, 'right'), 'l', n);
      L.innerHTML = pageHTML(2*target, 'left'); castSide = 'l';
    }
    apply = function(p){ bend(p); castShadow(castSide, p); };
  } else {
    leaf.style.left = '0px';
    if(dir > 0){
      bend = buildCurl(pageHTML(pos, 'single'), '<div class="pg single"></div>', 'r', n);
      R.innerHTML = pageHTML(target, 'single');
      apply = function(p){ bend(p); leaf.style.opacity = p < .55 ? 1 : Math.max(0, 1 - (p - .55)/.45); castShadow('r', p); };
    } else {
      bend = buildCurl(pageHTML(target, 'single'), '<div class="pg single"></div>', 'r', n);
      apply = function(p){ var q = 1 - p; bend(q); leaf.style.opacity = q < .55 ? 1 : Math.max(0, 1 - (q - .55)/.45); castShadow('r', q); };
    }
  }
  if(typeof paintSkills === 'function') paintSkills();
  apply(0);
  return {
    apply: apply,
    done: function(){ pos = target; cast.style.opacity = 0; render(); },
    cancel: function(){ cast.style.opacity = 0; render(); }
  };
}
/* the shadow the turning page throws: one fixed gradient, stretched from the spine with a transform,
   so the GPU only rescales it each frame instead of repainting a full page of pixels */
function castShadow(side, p){
  if(cast.dataset.side !== side + mode){
    cast.dataset.side = side + mode;
    cast.style.width = PW + 'px';
    cast.style.left = (side === 'r' && mode === 'spread' ? PW : 0) + 'px';
    cast.style.transformOrigin = side === 'r' ? 'left center' : 'right center';
    cast.style.background = 'linear-gradient(' + (side === 'r' ? 90 : 270) + 'deg, rgba(0,0,0,.22), rgba(0,0,0,0))';
  }
  cast.style.transform = 'scaleX(' + ((20 + 70 * (1 - p)) / 100) + ')';
  cast.style.opacity = String(Math.sin(Math.PI * p));
}
function turn(dir, dur, soft, target){
  if(busy || closed) return Promise.resolve(false);
  var t = setupTurn(dir, target);
  if(!t) return Promise.resolve(false);
  busy = true; updateBar(); fadeInk();
  dur = dur || 620;
  sound.page(dur / 1000, soft ? .8 : 1);
  return tween(t.apply, 0, 1, dur, true).then(function(){ busy = false; window.__lastTurn = performance.now(); t.done(); flushQueue(); return true; });
}
/* run whatever was pressed while the last page was still moving: quicker turns, so a burst of presses keeps up */
function flushQueue(){
  if(busy || closed || backClosed) { if(!busy){ queued = 0; queuedChapter = -1; } return; }
  if(queuedChapter >= 0){ var k = queuedChapter; queuedChapter = -1; queued = 0; jumpToChapter(k); return; }
  if(!queued) return;
  var d = queued > 0 ? 1 : -1; queued -= d;
  if(d > 0 && pos >= lastPos() || d < 0 && pos <= 0){ queued = 0; return; }
  turn(d, 420, true);
}
function jumpToChapter(k){
  var target = mode === 'spread' ? Math.floor(CHAPTERS[k].page / 2) : CHAPTERS[k].page;
  var run = closed ? openBook(true) : Promise.resolve();
  run.then(function(){
    if(backClosed) return;
    if(pos === target) return;
    turn(target > pos ? 1 : -1, 700, Math.abs(target - pos) > 1, target);
  });
}

/* closing from the back: the back board swings over and the stickers face up */
function applyBack(p){
  backBoard.hidden = p <= 0;
  // closed from the back: same as the front, the paper hides behind the board so no white edge shows
  var sb = p >= .9; bookbg.classList.toggle('shut', sb); bookbg.classList.toggle('back', sb); book.classList.toggle('shut', sb); book.classList.toggle('back', sb);
  if(mode === 'spread'){
    backBoard.style.transform = 'rotateY(' + (-180 * p) + 'deg)';
    bbF.style.visibility = p < .5 ? 'visible' : 'hidden'; bbB.style.visibility = p < .5 ? 'hidden' : 'visible';
    book.style.transform = 'translateX(' + (PW / 2 * p) + 'px)';
    R.style.visibility = p > 0 ? 'hidden' : 'visible';
    bookbg.style.right = (p <= 0 ? 0 : PW - PW * Math.max(0, Math.cos(Math.PI * p))) + 'px';
    shadeSide(1 - p);
    L.style.visibility = p >= 1 ? 'hidden' : 'visible';
    // the tabs ride along on the swinging board: readable from the front, mirrored round from the back
    // the tabs stay where they are and quietly fade as the back cover closes (and return as it opens)
    tabF.style.visibility = 'hidden'; tabB.style.visibility = 'hidden';
    tabsEl.style.opacity = String(1 - smooth(clamp01(p / .5))); tabsEl.style.visibility = p >= 1 ? 'hidden' : '';
  } else {
    var q = 1 - p; // on a phone the back cover swings in from the right, past the last page
    backBoard.style.transform = 'rotateY(' + (180 * q) + 'deg)';

var ESSAY_IS_DRAFT = false;  // the essay is Keshav's own
var LETTERS = [{
  title:'The blank page is doing the work', date:'fall 2026', kind:'essay',
  body:[
    'A friend recently asked me if using AI has made me dumber. Almost insulted, I rushed to say no. Defiantly, I challenged myself to write without AI assistance. As a blank page stared back at me, his question got louder and my answer stopped feeling true. My friend isn’t alone in asking this question though. Type “does using AI make me” into Google and “dumber” is among its first suggestions. In wonder, does science share our concern? Are the productivity gains of AI enough to justify our “cognitive surrender”? And should we be doing something about it?',
    'The ideas in this essay didn’t stem from a prompt. They came to me on a walk as I wrestled with what to write about. I thought to myself, “I do love talking about how technology helps us think. How do I make this more personal though? Oh no, I forgot I had an assignment due for my design class. Maybe I’ll just ask ChatGPT for a draft ... ahh but I really enjoy coming up with writing ideas though … oh wait!” One thought led to the next until the connections formed on their own. My favorite chatbot could have handed me a perfectly serviceable list of angles, but it could never have given me that walk. AI tools often sell themselves as the cure for the blank page. My argument is that the blank page was doing the work, and the best tools should protect some of that struggle.',
    'The science behind this is relatively young, and much of it is self-reported. In a CHI 2025 survey of 319 knowledge workers, people who trusted generative AI more reported thinking less critically about its output, while people who trusted their own skills reported thinking more [1]. The more we believe the machine, the less we check it. Researchers call this automation bias: accepting a machine’s output without checking it. A recently published review traces it across healthcare, finance, public administration, and national security [2]. That exact moment when the checking stops and blind acceptance begins is the “cognitive surrender.” It is also less simple than blind obedience. In survey experiments on algorithmic advice in a personnel decision, people did not automatically defer to algorithms over humans. They followed advice selectively, leaning on it when it matched what they already believed [3]. The AI hands us what we suspected, and we stop there. Being challenged takes effort, and a tool that removes the effort removes the challenge too.',
    'The usual fix is to make the AI explain itself, however, the same review finds that explanations alone often fail to cure overreliance and can even inflate confidence in wrong answers [2]. Human-computer interaction research offers a stranger idea: create friction on purpose. In one experiment, interface designs that forced people to engage before accepting an AI recommendation, called cognitive forcing functions, cut overreliance more than standard explanations did [4]. The catch is that participants rated those ‘friction’ designs the least favorable of all [4]. Much like the vitamins you know you should be taking, what helps us is often what we avoid. Thus, designers must redesign incentives to embrace the friction to empower a less dependent user.',
    'Friction does not necessarily mean having a locked door. Another study tested this with an AI system that shows only part of its reasoning so the user has to fill in the rest. Across two experiments with 264 and 210 participants, partial explanations led people to accept fewer wrong suggestions than a bare recommendation did, though a full explanation still did better overall [5]. Notably, the people who engaged most with the task gained the most [5]. Friction rewards those who want to engage, otherwise a thoughtful implementation may just be evaluated as poor design.',
    'So here is my proposal for any AI tool people use to think, whether for writing, coding, or deciding. First, hold back the answer until the user has made a reasonable attempt. Second, say when friction is on and why so the user always feels in control. Third, let the user dial it up or down, the way a video game lets you pick a difficulty. Nobody feels tricked by a difficulty setting they self-elected into.',
    'A fair objection here would be: I use AI to move fast, and nobody wants a tool that quizzes them before drafting an email. I can’t help but say touché. For some, a blank page is a real barrier, whether from writing in a second language or from writer’s block. Friction, though, should scale with the stakes. Rewording a message is a low stakes activity that needs none. A medical note, a code review, or a financial decision has earned a pause, and those are the very settings the automation bias research covers [2]. Friction can also follow trust. Because confidence in the AI predicts less checking [1], a tool could add a pause exactly when a user is most dependent. Lastly, since friction helps some people more than others [4], [5], adjustability must be a core part of the design.',
    'So what can you do? If you design or build AI products, ship a "try first" option and test it on people who dislike effortful thinking as well as those who enjoy it. Ask which decisions in a workflow deserve a pause. If you use these tools, switch friction on for the work you want to get better at or maybe just go take a walk before you default to a chat window. It’s like going to the gym for the mind. The industrial revolution relaxed physical effort from our daily lives and we built gyms to bring that back. Mental effort might just be next.',
    'So, does using AI make us dumber? It absolutely can if we use it to dodge the blank page. Perhaps, I was wrong to reject my friend’s question. I would answer differently now, not because this page isn’t blank anymore, but because I made the effort to think first.'
  ],
  refs:[
    'H.-P. Lee et al., “The impact of generative AI on critical thinking: Self-reported reductions in cognitive effort and confidence effects from a survey of knowledge workers,” CHI ’25, Yokohama, Apr. 2025. <a href="https://doi.org/10.1145/3706598.3713778" target="_blank" rel="noopener">doi</a>',
    'G. Romeo and D. Conti, “Exploring automation bias in human–AI collaboration: A review and implications for explainable AI,” AI &amp; Society, vol. 41, no. 1, Jan. 2026. <a href="https://doi.org/10.1007/s00146-025-02422-7" target="_blank" rel="noopener">doi</a>',
    'S. Alon-Barkat and M. Busuioc, “Human–AI interactions in public sector decision making: ‘Automation bias’ and ‘selective adherence’ to algorithmic advice,” J. Public Admin. Res. Theory, vol. 33, no. 1, Jan. 2023. <a href="https://doi.org/10.1093/jopart/muac007" target="_blank" rel="noopener">doi</a>',
    'Z. Buçinca, M. B. Malaya, and K. Z. Gajos, “To trust or to think: Cognitive forcing functions can reduce overreliance on AI in AI-assisted decision-making,” Proc. ACM HCI, CSCW1, Apr. 2021. <a href="https://doi.org/10.1145/3449287" target="_blank" rel="noopener">doi</a>',
    'S. de Jong, V. Paananen, B. Tag, and N. van Berkel, “Cognitive forcing for better decision-making: Reducing overreliance on AI systems through partial explanations,” Proc. ACM HCI, vol. 9, no. 2, May 2025. <a href="https://doi.org/10.1145/3710946" target="_blank" rel="noopener">doi</a>'
  ]

    refit();   // check again once, in case the size moved during the layout
  }, 120);
}
window.addEventListener('resize', refit);
window.addEventListener('orientationchange', refit);
if(window.visualViewport) window.visualViewport.addEventListener('resize', refit);
if(window.ResizeObserver) new ResizeObserver(refit).observe(document.documentElement);
/* some browsers (DevTools' device switcher, iOS address bar changes) settle on the final size without a last resize event, so also check now and then */
setInterval(function(){ if(!busy && viewDims() !== LDIM) layout(); }, 400);
layout();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(!busy) layout(); });
/* arrived on a page link (e.g. /essay): swing the cover open straight onto that page */
if(startSlug){
  var si = IDX[startSlug];
  pos = mode === 'spread' ? Math.floor(si / 2) : si; linkSlug = startSlug; render();
  // the inside of the cover normally shows page 1; show the linked spread's left page instead, so the cover opens straight onto it
  if(mode === 'spread') coverB.innerHTML = pageHTML(2 * pos, 'left');
  openBook(true).then(function(){
    coverB.innerHTML = mode === 'spread' ? pageHTML(0, 'left') : '<div class="pg single"></div>';   // back to page 1 for when the book is closed again
    urlReady = true; syncURL();
  });
} else { urlReady = true; syncURL(); }

/* ---------- arrange mode (?arrange): place the sketch ornaments by hand ---------- */
if(/[?&]arrange\b/.test(location.search)){
  document.documentElement.classList.add('arranging');
  var lk = function(){ return mode === 'spread' ? 'spread' : 'single'; };
  var bar = document.createElement('div'); bar.id = 'arrangeBar';
  bar.innerHTML = '<span>arrange: drag to move · scroll to resize · shift+scroll to rotate</span><button type="button" data-a="copy">copy layout</button><button type="button" class="ghost" data-a="reset">reset this layout</button>';
  document.body.appendChild(bar);
  var saveOrn = function(){ store('nb-orn', JSON.stringify(ORN_LAYOUT)); };
  var ornState = function(el){
    var name = el.getAttribute('data-orn'), at = ORN_LAYOUT[lk()][name];
    if(at) return at;
    var sk = el.querySelector('.skt'), f = mode === 'spread' ? 1 : (el.classList.contains('sm') ? .6 : .8);
    var r = parseFloat(el.style.getPropertyValue('--r')) || 0, h = Math.round(sk.offsetHeight * f);
    var pr = el.parentNode.getBoundingClientRect(), er = el.getBoundingClientRect(), k = pr.width / el.parentNode.offsetWidth;
    var w = sk.offsetWidth * f;
    // centre of the drawn box, back in page pixels, minus half the unscaled size
    var cx = (er.left + er.width / 2 - pr.left) / k, cy = (er.top + er.height / 2 - pr.top) / k;
    return [Math.round(cx - w / 2), Math.round(cy - h / 2), h, r];
  };
  var paintOrn = function(el, at){
    el.classList.add('placed');
    el.style.cssText = 'left:' + at[0] + 'px;top:' + at[1] + 'px;--r:' + at[3] + 'deg;--h:' + at[2] + 'px';
  };
  var drag = null;
  document.addEventListener('pointerdown', function(e){
    var el = e.target.closest && e.target.closest('.orn'); if(!el) return;
    e.stopPropagation(); e.preventDefault();
    var at = ornState(el).slice(), k = el.parentNode.getBoundingClientRect().width / el.parentNode.offsetWidth;
    paintOrn(el, at);
    drag = { el:el, at:at, x0:e.clientX, y0:e.clientY, k:k, ax:at[0], ay:at[1] };
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  }, true);
  document.addEventListener('pointermove', function(e){
    if(!drag) return; e.stopPropagation();
    drag.at[0] = Math.round(drag.ax + (e.clientX - drag.x0) / drag.k);
    drag.at[1] = Math.round(drag.ay + (e.clientY - drag.y0) / drag.k);
    paintOrn(drag.el, drag.at);
  }, true);
  document.addEventListener('pointerup', function(e){
    if(!drag) return; e.stopPropagation();
    ORN_LAYOUT[lk()][drag.el.getAttribute('data-orn')] = drag.at; saveOrn(); drag = null;
  }, true);
  document.addEventListener('click', function(e){ if(e.target.closest && e.target.closest('.orn')){ e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener('wheel', function(e){
    var el = e.target.closest && e.target.closest('.orn'); if(!el) return;
    e.preventDefault(); e.stopPropagation();
    var at = ornState(el).slice(), d = (e.deltaY || e.deltaX) > 0 ? -1 : 1;
    if(e.shiftKey) at[3] = Math.round(at[3] + d);
    else {
      var nh = Math.max(24, Math.min(320, at[2] + d * 3)), name = el.getAttribute('data-orn'), ar = SKETCH[name][0] / SKETCH[name][1];
      // grow around the centre
      at[0] = Math.round(at[0] - (nh - at[2]) * ar / 2); at[1] = Math.round(at[1] - (nh - at[2]) / 2); at[2] = nh;
    }
    paintOrn(el, at); ORN_LAYOUT[lk()][el.getAttribute('data-orn')] = at; saveOrn();
  }, { capture:true, passive:false });
  bar.addEventListener('click', function(e){
    var a = e.target.getAttribute && e.target.getAttribute('data-a'); if(!a) return;
    if(a === 'copy'){
      var txt = JSON.stringify(ORN_LAYOUT);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){ e.target.textContent = 'copied ✓'; }, function(){ prompt('Copy this layout:', txt); });
      setTimeout(function(){ e.target.textContent = 'copy layout'; }, 1600);
    } else if(a === 'reset'){ ORN_LAYOUT[lk()] = {}; saveOrn(); render(); }
  });
}
})();
</script>

</body>
