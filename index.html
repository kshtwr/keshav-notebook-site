<style>
/* Layout: one notebook centered on a desk. Desktop shows a two-page spread with index tabs on the right edge; phones show one page with tabs across the top. */
:root{
  --desk:#EEEEEE; --page:#FFFFFF; --ink:#171717; --muted:#6B6B6B; --faint:#9A9A9A; --line:#E6E6E6;
  --grid:rgba(0,0,0,.055); --pen:#3D3D3D; --tab:#F5F5F5; --tab-ink:#6B6B6B; --tab-line:#DCDCDC;
  --on:#171717; --on-ink:#FFFFFF; --cover:#0B0B0B; --cover-band:#1D1D1D; --label:#FFFFFF; --label-ink:#171717;
  --shadow:0 2px 0 #E2E2E2, 0 4px 0 #FFFFFF, 0 6px 0 #E2E2E2, 0 30px 60px rgba(0,0,0,.22);
  --spine:rgba(0,0,0,.08); --curl:#E3E3E3; --sticky:#FFF4C2; --sticky-ink:#171717; --tape:rgba(190,190,190,.5);
  --polaroid:#FFFFFF; --photo:#F1F1F1; --bar:#FFFFFF; --bar-line:#E3E3E3; --focus:#171717;
  --t1:#FFFFFF; --t2:#F2F2F2; --t3:#E6E6E6; --t4:#D9D9D9; --t5:#CCCCCC; --t4-ink:#525252;
  --bar-ink:#171717; --bar-muted:#6B6B6B; --bar-hover:#F2F2F2; --pocket:#F2F2F2;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --hand:'Caveat','Bradley Hand','Segoe Print',cursive;
}
@media (pointer:coarse){.tg{width:40px;height:40px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#000000; --page:#0B0B0B; --ink:#EDEDED; --muted:#8F8F8F; --faint:#5E5E5E; --line:#232323;
  --grid:rgba(255,255,255,.05); --pen:#D4D4D4; --tab:#141414; --tab-ink:#8F8F8F; --tab-line:#2A2A2A;
  --on:#D4D4D4; --on-ink:#0B0B0B; --cover:#151515; --cover-band:#262626; --label:#E9E9E9; --label-ink:#171717;
  --shadow:0 2px 0 #1E1E1E, 0 4px 0 #0B0B0B, 0 6px 0 #1E1E1E, 0 0 0 1px rgba(255,255,255,.05), 0 24px 70px rgba(255,255,255,.09);
  --spine:rgba(0,0,0,.6); --curl:#262626; --sticky:#232323; --sticky-ink:#EDEDED; --tape:rgba(255,255,255,.14);
  --polaroid:#1A1A1A; --photo:#262626; --bar:#111111; --bar-line:#262626; --focus:#EDEDED;
  --t1:#2E2E2E; --t2:#282828; --t3:#222222; --t4:#1C1C1C; --t5:#171717; --t4-ink:#8F8F8F;
  --bar-ink:#EDEDED; --bar-muted:#8F8F8F; --bar-hover:#1A1A1A; --pocket:#161616; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#000000; --page:#0B0B0B; --ink:#EDEDED; --muted:#8F8F8F; --faint:#5E5E5E; --line:#232323;
  --grid:rgba(255,255,255,.05); --pen:#D4D4D4; --tab:#141414; --tab-ink:#8F8F8F; --tab-line:#2A2A2A;
  --on:#D4D4D4; --on-ink:#0B0B0B; --cover:#151515; --cover-band:#262626; --label:#E9E9E9; --label-ink:#171717;
  --shadow:0 2px 0 #1E1E1E, 0 4px 0 #0B0B0B, 0 6px 0 #1E1E1E, 0 0 0 1px rgba(255,255,255,.05), 0 24px 70px rgba(255,255,255,.09);
  --spine:rgba(0,0,0,.6); --curl:#262626; --sticky:#232323; --sticky-ink:#EDEDED; --tape:rgba(255,255,255,.14);
  --polaroid:#1A1A1A; --photo:#262626; --bar:#111111; --bar-line:#262626; --focus:#EDEDED;
  --t1:#2E2E2E; --t2:#282828; --t3:#222222; --t4:#1C1C1C; --t5:#171717; --t4-ink:#8F8F8F;
  --bar-ink:#EDEDED; --bar-muted:#8F8F8F; --bar-hover:#1A1A1A; --pocket:#161616; color-scheme:dark}
:root[data-tabs="red"]{--on:#C8323A; --on-ink:#FFFFFF}

html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  -webkit-font-smoothing:antialiased;transition:background-color .4s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
a{color:inherit}

#stage{position:absolute;inset:0 0 auto 0;display:flex;align-items:safe center;justify-content:safe center}
.flipwrap{position:fixed;z-index:15;pointer-events:none}
.flipcard{position:absolute;inset:0;transform-style:preserve-3d}
.fside{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.fface{position:absolute;left:0;top:0;transform-origin:0 0}
.fedge{position:absolute;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fedge.spine{background:linear-gradient(90deg,var(--cover),color-mix(in srgb,var(--cover) 78%,#fff) 50%,var(--cover));border-radius:8px}
.fedge.pages{background:linear-gradient(90deg,var(--cover) 0 2px,transparent 2px calc(100% - 2px),var(--cover) calc(100% - 2px)),repeating-linear-gradient(90deg,var(--page) 0 1.6px,color-mix(in srgb,var(--ink) 22%,var(--page)) 1.6px 2.2px)}
#stage.zoomed{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#stage.zoomed #box{margin:16px 16px 72px}
#stage.zoomed::-webkit-scrollbar{width:5px;height:5px}#stage.zoomed::-webkit-scrollbar-track,#stage.zoomed::-webkit-scrollbar-corner{background:transparent}#stage.zoomed::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
#stage.zoomed:hover::-webkit-scrollbar-thumb{background:var(--faint)}
#box{position:relative}
#fit{position:absolute;left:0;top:0;transform-origin:0 0}
.book{position:absolute;perspective:2600px;touch-action:none;user-select:none;-webkit-user-select:none}
.openshade{position:absolute;top:0;bottom:0;border-radius:6px;box-shadow:var(--shadow);pointer-events:none;display:none}
.bookbg{position:absolute;top:0;bottom:0;right:0;border-radius:6px;box-shadow:var(--shadow);background:var(--page)}
.slot{position:absolute;top:0;bottom:0;z-index:1}
.pg{position:absolute;inset:0;background-color:var(--page);
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;overflow:hidden;color:var(--ink);transition:background-color .4s}
.pg.left{border-radius:6px 0 0 6px}.pg.right{border-radius:0 6px 6px 0}.pg.single{border-radius:6px 10px 10px 6px}
.pg.left::after,.pg.right::after,.pg.single::after{content:"";position:absolute;top:0;bottom:0;width:46px;pointer-events:none}
.pg.left::after{right:0;background:linear-gradient(90deg,transparent,var(--spine))}
.pg.right::after{left:0;background:linear-gradient(270deg,transparent,var(--spine))}
.pg.single::after{left:0;width:22px;background:linear-gradient(270deg,transparent,var(--spine))}
.pc{position:absolute;inset:0;padding:42px 46px 46px;display:flex;flex-direction:column;gap:22px}
.single .pc{padding:30px 26px 40px;gap:18px}
.pfoot{position:absolute;bottom:18px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.left .pfoot{left:46px}.right .pfoot{right:46px}.single .pfoot{left:26px}

.leaf,.cover{position:absolute;top:0;bottom:0;transform-style:preserve-3d;will-change:transform;z-index:5}
.cover{z-index:6;cursor:pointer}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.08));opacity:0;z-index:4}

.cv{position:absolute;inset:0;background:var(--cover);border-radius:6px 14px 14px 6px;overflow:hidden;transition:background-color .4s}
.cv .spine{position:absolute;left:0;top:0;bottom:0;width:20px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(0,0,0,.4) 70%,rgba(255,255,255,.03))}
.cv .band{position:absolute;right:46px;top:0;bottom:0;width:10px;background:var(--cover-band);box-shadow:inset 1px 0 0 rgba(255,255,255,.07)}
.cv .label{position:absolute;left:84px;top:220px;width:272px;height:140px;background:var(--label);border-radius:4px;padding:16px 18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;color:var(--label-ink)}
.cv .label small{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#6B6B6B}
.sigline{height:62px;border-bottom:1px solid #A9A9A9;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.sig{font-family:var(--hand);font-weight:600;font-size:44px;line-height:1;color:#171717;clip-path:inset(0 100% 0 0);display:inline-block;padding:0 10px 0 6px}
.signed .sig{clip-path:inset(0 0 0 0)}
.cv .doodle{position:absolute;left:84px;bottom:56px;width:84px;height:84px;border:1px dashed #5C5C5C;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#8F8F8F}

.tabs{position:absolute;z-index:8;display:flex;gap:6px}
.spread .tabs{left:calc(100% - 18px);top:48px;flex-direction:column;align-items:flex-start;z-index:0;gap:6px}
.single .tabs{left:12px;right:12px;top:-46px;height:46px;flex-direction:row;align-items:flex-end;gap:4px;z-index:4}
.tab{background:var(--tab);color:var(--tab-ink);border:1px solid var(--tab-line);font-family:var(--mono);font-size:10px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;
  transition:background-color .35s,color .35s,width .35s cubic-bezier(.3,.7,.2,1),height .35s cubic-bezier(.3,.7,.2,1),border-color .35s}
.tab:nth-child(1){background:var(--t1)}.tab:nth-child(2){background:var(--t2)}.tab:nth-child(3){background:var(--t3)}.tab:nth-child(4){background:var(--t4)}.tab:nth-child(5){background:var(--t5);color:var(--t4-ink)}
.spread .tab{width:62px;border-left:0;border-radius:0 8px 8px 0;justify-content:flex-end;padding-right:10px;box-sizing:border-box;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.spread .tab:nth-child(1){height:90px}.spread .tab:nth-child(2){height:74px}.spread .tab:nth-child(3){height:102px}.spread .tab:nth-child(4){height:118px}.spread .tab:nth-child(5){height:92px}
.spread .tab span{writing-mode:vertical-rl;font-size:10.5px}
.spread .tab.on{width:72px}
.single .tab{flex:1;height:40px;border-bottom:0;border-radius:8px 8px 0 0;min-width:0}
.single .tab.on{height:46px;flex:1.35}
.tab.on,.tab.on:nth-child(n){background:var(--on);color:var(--on-ink);border-color:var(--on)}
.tab:hover:not(.on){color:var(--ink)}
.tabs.ride{pointer-events:none;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.single .tabs.ride{display:none}
.tabs.mirror{transform:rotateY(180deg)}
.spread .tabs.mirror{align-items:flex-end}
.spread .tabs.mirror .tab{border-left:1px solid var(--tab-line);border-right:0;border-radius:8px 0 0 8px;justify-content:flex-start;padding-right:0;padding-left:10px}

.corner{position:absolute;bottom:0;width:84px;height:84px;z-index:7;cursor:grab;touch-action:none}
.corner::before{content:"";position:absolute;bottom:0;width:26px;height:26px;transition:width .25s,height .25s;box-shadow:-4px -4px 10px rgba(0,0,0,.08)}
.corner.next{right:0}.corner.next::before{right:0;background:linear-gradient(135deg,transparent 50%,var(--curl) 50%)}
.corner.prev{left:0}.corner.prev::before{left:0;background:linear-gradient(225deg,transparent 50%,var(--curl) 50%);box-shadow:4px -4px 10px rgba(0,0,0,.08)}
.corner:hover::before,.corner:focus-visible::before{width:46px;height:46px}
.corner:active{cursor:grabbing}
.book.turning .corner::before{opacity:0;transition:none}

.strip{position:absolute;top:0;height:100%;transform-style:preserve-3d}
.sface{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sface.back{transform:rotateY(180deg)}
.sface>.inner{position:absolute;top:0;height:100%}
.sshade{position:absolute;inset:0;pointer-events:none;background:#000;opacity:0}
.cast{position:absolute;top:0;bottom:0;z-index:2;pointer-events:none;opacity:0}
body{cursor:var(--cur-arrow,auto)}
.book .slot,.book canvas{cursor:var(--cur-pencil,crosshair)}
.cover,.tab,a,button,#bar button{cursor:var(--cur-point,pointer)}
.corner,.corner:active{cursor:var(--cur-turn,grab)}
canvas#ink{position:absolute;left:0;top:0;z-index:3;pointer-events:none}

#hint{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
#hint button{width:36px;height:36px;border-radius:50%;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:color .2s,background-color .2s}
#hint button:hover,#hint button:focus-visible{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
#pgnum{min-width:64px;text-align:center}
#hint span{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted)}


/* page content */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hand{font-family:var(--hand);font-weight:500;color:var(--pen);letter-spacing:0;text-transform:none}
.h1{font-size:27px;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
.h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0}
.lede{font-size:14px;line-height:1.55;color:var(--muted);margin:0;max-width:44ch}
.lede em{font-style:normal;color:var(--ink);background:linear-gradient(transparent 82%,color-mix(in srgb,var(--pen) 40%,transparent) 82%,color-mix(in srgb,var(--pen) 40%,transparent) 90%,transparent 90%)}
.list{display:flex;flex-direction:column;gap:13px;margin:0;padding:0;list-style:none}
.it{display:flex;flex-direction:column;gap:2px;font-size:13.5px;line-height:1.4}
.it .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.it b{font-weight:500}
.it span.m{color:var(--muted)}
.yr{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-family:var(--hand);font-size:20px;line-height:1.05;color:var(--pen);display:inline-block;transform:rotate(-2deg);transform-origin:left}
.circle{position:relative;display:inline-block;white-space:nowrap}
.circle svg{position:absolute;left:-10px;top:-7px;width:calc(100% + 20px);height:calc(100% + 14px);color:var(--pen);overflow:visible}
.polaroid{float:right;width:150px;margin:0 0 10px 14px;transform:rotate(4deg);display:flex;flex-direction:column;align-items:center}
.polaroid .tape{width:62px;height:20px;background:var(--tape);margin-bottom:-10px;position:relative;z-index:1;transform:rotate(-6deg)}
.polaroid .frame{width:100%;background:var(--polaroid);padding:9px 9px 32px;box-sizing:border-box;box-shadow:0 6px 16px rgba(0,0,0,.16)}
.polaroid .ph{height:124px;background:var(--photo);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted)}
.polaroid .cap{margin-top:-28px;font-family:var(--hand);font-size:18px;color:var(--pen)}
.sticky{translate:var(--dx,0px) var(--dy,0px);position:relative;z-index:2;cursor:var(--cur-turn,grab);touch-action:none;background:var(--sticky);color:var(--sticky-ink);font-family:var(--hand);font-size:20px;line-height:1.1;padding:12px 14px;width:150px;box-sizing:border-box;transform:rotate(-3deg);box-shadow:0 5px 12px rgba(0,0,0,.12)}
.box{border:1px dashed var(--faint);border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);padding:10px}
.bul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.45}
.bul li::marker{color:var(--faint)}
.links{display:flex;flex-wrap:wrap;row-gap:6px;gap:14px;font-family:var(--mono);font-size:11.5px}
.links a{text-underline-offset:3px}
.big-hand{font-family:var(--hand);font-size:40px;line-height:1;color:var(--pen);margin:0}
.mail{font-family:var(--mono);font-size:12.5px;user-select:text;-webkit-user-select:text}
.tiny{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0}

/* overview links */
.golist{gap:4px}
.embed{width:100%;border:0;border-radius:12px;background:var(--tab)}
.glance{display:flex;flex-direction:column;gap:6px}
.glance .golist{gap:0}
.glance .go{padding-top:3px;padding-bottom:3px}
.go .gl{display:block;font-size:12.5px;line-height:1.4;color:var(--muted);margin-top:1px}
.go.static{cursor:inherit}
.single .go .gl{display:none}
.go.static:hover{background:none}.go.static:hover b{text-decoration:none}
.go .arr{opacity:.3}
.tucked{animation:peek 1.4s ease-in-out .9s 1 both}
@keyframes peek{0%,100%{translate:0 0}45%{translate:0 -12px}}
.toc .go{padding-top:3px;padding-bottom:3px}
.toc .yr{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.seccover{height:150px}
.single .seccover{height:120px}
.sec{display:flex;flex-direction:column;gap:8px}
.polaroid[data-photo]{margin-top:18px;width:140px}
.go{display:block;width:calc(100% + 16px);box-sizing:border-box;text-align:left;padding:5px 8px;margin:0 -8px;border-radius:5px;font-size:13.5px;line-height:1.35;color:var(--ink)}
.go .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.go b{font-weight:500}.go .m{color:var(--muted)}
.go .arr{font-style:normal;margin-left:8px;opacity:.3;transition:opacity .2s,transform .2s;display:inline-block}
.go:hover{background:color-mix(in srgb,var(--pen) 7%,transparent)}
.go:hover b{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.go:hover .arr,.go:focus-visible .arr{opacity:1;transform:translateX(3px)}
.bul strong{font-weight:600}
/* a sealed envelope holding a recommendation */
.envrow{margin-top:auto;display:flex;align-items:flex-end;gap:18px;padding-left:6px}
.env{position:relative;flex:none;width:140px;height:90px;background:var(--sticky);color:var(--sticky-ink);border:1.2px solid color-mix(in srgb,var(--sticky-ink) 55%,transparent);border-radius:2px;box-sizing:border-box;transform:rotate(-3deg);box-shadow:0 3px 8px rgba(0,0,0,.08);transition:transform .3s cubic-bezier(.3,.7,.2,1),box-shadow .3s}
.env:hover,.env:focus-visible{transform:rotate(-1deg) translateY(-5px);box-shadow:0 10px 18px rgba(0,0,0,.14)}
.env svg{position:absolute;inset:0;width:100%;height:100%}
.envrow.right{justify-content:flex-end;padding:0 6px 0 0;margin-top:-14px}
.envrow.right .note{text-align:right;transform:rotate(2deg)}
.envrow .note{transform:rotate(-3deg);margin-bottom:22px;max-width:220px}

.skills{font-size:12.5px;line-height:1.45;color:var(--muted);margin:0}
.skills b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--ink);margin-right:4px}
.media{width:100%;flex:1 1 0;min-height:130px;max-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
/* a demo video taped into the notebook inside a pencil-drawn frame */
.sketch{position:relative;flex:1 1 0;min-height:0;aspect-ratio:16/9;max-width:calc(100% - 20px);transform:rotate(var(--r,-.8deg))}
.sketch .rough{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);color:var(--pen);overflow:visible;pointer-events:none}
.sketch .tp{position:absolute;width:54px;height:17px;background:var(--tape);z-index:2}
.sketch .tp.a{left:-16px;top:-6px;transform:rotate(-32deg)}.sketch .tp.b{right:-16px;bottom:-6px;transform:rotate(-32deg)}
.vid{position:absolute;inset:0;overflow:hidden;background:#000}
.vid img,.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;transition:opacity .8s}
.vid iframe{position:absolute;left:50%;top:50%;width:100%;height:100%;border:0;transform:translate(-50%,-50%) scale(1.22);pointer-events:none}
.vid.live img{opacity:0}
.vid video{z-index:0}
.vcap{background:none;border:0;padding:0;cursor:var(--cur-point,pointer)}
.vid.touch iframe{left:0;top:0;transform:none;pointer-events:auto}
.sketch.free{aspect-ratio:auto;flex:none;width:calc(100% - 20px);height:232px}
.vid.spot{background:transparent}.vid.spot iframe{border-radius:12px}
.media.tall{flex:none;max-height:none;margin-top:auto}
.sketch.reel{aspect-ratio:auto;flex:none;width:197px;height:350px}
.vid.ig iframe{left:-41.5px;top:-54px;width:280px;height:900px}
.media.snaps.natural{flex:none;max-height:none;align-items:center;justify-content:center}
.snaps.natural .polaroid{height:auto;max-width:none}.snaps.natural .polaroid .frame{height:auto}.snaps.natural .polaroid img{flex:none;height:auto}
.vcap{font-family:var(--hand);font-size:17px;line-height:1;color:var(--pen);text-decoration:none}
.vcap:hover{text-decoration:underline;text-underline-offset:3px}
.vcaps{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.vlink{position:absolute;inset:0;z-index:3;cursor:var(--cur-point,pointer)}
.vlink:focus-visible{outline-offset:6px}
/* photos as polaroids */
.media.snaps{flex-direction:row;align-items:flex-start;gap:14px;padding-top:6px}
.snaps .polaroid{float:none;margin:0;width:44%;max-width:180px;height:100%;transform:rotate(var(--r,-3deg))}
.snaps .polaroid .frame{height:calc(100% - 10px);display:flex;flex-direction:column;padding:8px 8px 0}
.media.scatter{display:block;position:relative;flex:1 1 0;max-height:none;margin-top:6px}
.scatter .polaroid{position:absolute;float:none;margin:0}
.scatter .polaroid.tl{left:0;top:0;width:66%;transform:rotate(-3deg)}
.scatter .polaroid.br{right:0;bottom:10px;width:47%;transform:rotate(3.5deg)}
.scatter .polaroid .frame{display:block;padding:9px 9px 0}
.scatter .polaroid img{display:block;width:100%;height:auto}
.scatter .polaroid .cap{display:block;margin:0;padding:6px 0 8px;text-align:center;font-size:18px}
.media.snaps.big{max-height:330px}
.media.snaps.natural.big{margin:auto 0}
.snaps .polaroid img{display:block;width:100%;flex:1 1 0;min-height:0;object-fit:cover}
.snaps .polaroid .cap{margin:0;padding:4px 0 6px;text-align:center;font-size:17px;line-height:1.1}
.media.doodle{flex:none;height:96px;min-height:0;margin-top:auto;align-items:center;justify-content:center;color:var(--pen)}
.media.doodle.sm{height:60px}
.media.doodle svg{height:100%;width:auto;max-width:100%;overflow:visible}
.bul.sm{font-size:12.5px;gap:4px;color:var(--muted);margin-top:4px}
.it + .it{margin-top:4px}

/* back cover and its stickers */
.cv.backside .spine{left:auto;right:0;background:linear-gradient(270deg,rgba(255,255,255,.07),rgba(0,0,0,.4) 70%,rgba(255,255,255,.03))}
.cv.backside{border-radius:14px 6px 6px 14px}
.cv.backside .band{right:auto;left:46px}
.stks{position:absolute;left:0;top:0;width:520px;height:660px;transform-origin:0 0}
.stk{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;box-shadow:0 0 0 4px #FFFFFF,0 4px 10px rgba(0,0,0,.45);font-family:var(--sans);font-weight:700;letter-spacing:.04em;line-height:1.05}
.stk small{font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.12em}
.stk svg{display:block}
.stk.ghost{box-shadow:none;border:1.5px dashed #6B6B6B;color:#8F8F8F;font-family:var(--mono);font-weight:500;font-size:10px}


/* the sticky-note agent: it rests on the desk, or sticks to a page and turns with it */
.agent{position:fixed;left:0;top:0;z-index:12;width:136px;height:116px;transform-origin:0 0;touch-action:none}
.ag-mini{position:absolute;left:0;top:0;width:136px;height:116px;background:var(--sticky);color:var(--sticky-ink);padding:12px 13px 10px;box-sizing:border-box;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;transform:rotate(-4deg);transform-origin:50% 0;touch-action:none;
  box-shadow:0 6px 14px rgba(0,0,0,.16);transition:transform .35s cubic-bezier(.3,.7,.2,1),box-shadow .35s;cursor:var(--cur-turn,grab)}
.ag-mini::before{content:"";position:absolute;left:44px;top:-9px;width:50px;height:18px;background:var(--tape);transform:rotate(3deg)}
.ag-mini:hover{transform:rotate(-2deg) translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.2)}
.agent.dragging .ag-mini{transform:rotate(3deg) scale(1.05);box-shadow:0 18px 30px rgba(0,0,0,.25);transition:none}
.ag-hint{font-family:var(--hand);font-size:19px;line-height:1.05;clip-path:inset(0 0 0 0)}
.ag-mini small,.ag-top small{font-family:var(--mono);font-size:9px;letter-spacing:.12em;opacity:.65}
.agpage{position:absolute;z-index:3;width:136px;height:116px}
.ag-card{position:fixed;left:0;top:0;z-index:26;width:320px;height:380px;background:var(--sticky);color:var(--sticky-ink);
  padding:14px 16px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;transform-origin:20% 100%;
  box-shadow:0 18px 40px rgba(0,0,0,.22),0 2px 4px rgba(0,0,0,.08);transform:rotate(-1.5deg) scale(1);transition:transform .45s cubic-bezier(.3,.8,.2,1),opacity .3s}
.ag-card.closed{transform:rotate(-4deg) scale(.42);opacity:0;pointer-events:none}
.ag-card::before{content:"";position:absolute;left:120px;top:-10px;width:66px;height:20px;background:var(--tape);transform:rotate(-2deg)}
.ag-top{display:flex;justify-content:space-between;align-items:center}
.ag-top button{width:30px;height:30px;font-size:18px;line-height:1;border-radius:50%;color:inherit}
.ag-top button:hover{background:rgba(0,0,0,.06)}
.ag-ans{font-family:var(--hand);font-size:22px;line-height:1.12;white-space:pre-wrap;flex:1 1 0;min-height:0;overflow:hidden}
.ag-ans .think{opacity:.55}
.ag-sugg{display:flex;flex-wrap:wrap;gap:6px}
.ag-sugg button{font-family:var(--hand);font-size:17px;line-height:1;padding:6px 9px;border:1px dashed currentColor;border-radius:14px;opacity:.8;color:inherit}
.ag-sugg button:hover{opacity:1;background:rgba(0,0,0,.04)}
.ag-form{display:flex;gap:8px;align-items:flex-end;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.ag-form input{flex:1;min-width:0;background:none;border:0;outline:none;color:inherit;font-family:var(--hand);font-size:22px;padding:4px 0}
.ag-form input::placeholder{color:inherit;opacity:.45}
.ag-form button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;min-height:36px;padding:0 4px;color:inherit}
.ag-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;opacity:.75;min-height:24px}
.ag-foot button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-decoration:underline;text-underline-offset:3px;color:inherit;min-height:28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* answers stuck onto a page */
.pin{position:absolute;z-index:2;cursor:var(--cur-turn,grab);touch-action:none;width:150px;background:var(--sticky);color:var(--sticky-ink);font-family:var(--hand);font-size:17px;line-height:1.1;padding:12px 12px 10px;box-sizing:border-box;box-shadow:0 5px 12px rgba(0,0,0,.14)}
.pin::before{content:"";position:absolute;left:46px;top:-8px;width:48px;height:16px;background:var(--tape)}
.pin .unpin{position:absolute;right:2px;top:2px;width:24px;height:24px;font-family:var(--sans);font-size:14px;opacity:.5;color:inherit}
.pin .unpin:hover{opacity:1}

/* a letter tucked into a pocket on the journal page */
.pocketwrap{position:relative;margin-top:auto;height:236px}
.tucked{position:absolute;left:9%;right:9%;top:0;height:210px;background:var(--page);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.1);
  transform:rotate(-2.5deg);padding:14px 16px;box-sizing:border-box;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink);
  transition:transform .3s cubic-bezier(.3,.7,.2,1);cursor:var(--cur-point,pointer)}
.tucked:hover,.tucked:focus-visible{transform:rotate(-2.5deg) translateY(-14px)}
.tucked .tk-title{font-size:17px;font-weight:600;letter-spacing:-.01em}
.tucked .tk-lines{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.tucked .tk-lines i{display:block;height:1.5px;background:var(--line)}
.pocket{position:absolute;left:0;right:0;bottom:0;height:152px;background:var(--sticky);border:1px solid color-mix(in srgb,var(--sticky-ink) 22%,transparent);pointer-events:none;
  clip-path:polygon(0 0,38% 0,50% 16px,62% 0,100% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;box-sizing:border-box}
.pocket span{font-family:var(--hand);font-size:20px;color:var(--sticky-ink)}
#letterDim{position:fixed;inset:0;z-index:28;background:rgba(0,0,0,.5);opacity:0;transition:opacity .45s}
#letter{position:fixed;left:0;top:0;z-index:29;transform-origin:0 0;perspective:2200px}
.lt-panel{position:absolute;left:0;width:100%;transform-style:preserve-3d;transform-origin:50% 0}
.lt-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--page)}
.lt-face.back{transform:rotateX(180deg);background:linear-gradient(180deg,var(--page),var(--pocket))}
.lt-face .crease{position:absolute;left:0;right:0;height:10px;pointer-events:none}
.lt-shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.lt-sheet{position:absolute;inset:0;background:var(--page);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.lt-body{padding:44px clamp(22px,7%,64px) 64px;display:flex;flex-direction:column;gap:16px;color:var(--ink);box-sizing:border-box;
  background-image:linear-gradient(transparent calc(33.333% - 1px),rgba(0,0,0,.05) calc(33.333% - 1px),rgba(0,0,0,.05) 33.333%,transparent 33.333%,transparent calc(66.666% - 1px),rgba(0,0,0,.05) calc(66.666% - 1px),rgba(0,0,0,.05) 66.666%,transparent 66.666%)}
.lt-body h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lt-body p{font-size:16px;line-height:1.68;margin:0;max-width:62ch}
.lt-body .refs{margin:0;padding-left:20px;font-size:12.5px;line-height:1.55;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.lt-body .refs a{color:inherit}
.lt-body .ph{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.lt-close{position:absolute;right:8px;top:8px;z-index:2;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:300;line-height:1;color:var(--muted);background:none;border:0;border-radius:50%;transition:color .2s,transform .2s}
.lt-close:hover,.lt-close:focus-visible{color:var(--ink);transform:rotate(90deg)}

.lt-sheet::-webkit-scrollbar{width:5px}.lt-sheet::-webkit-scrollbar-track{background:transparent}.lt-sheet::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.lt-sheet:hover::-webkit-scrollbar-thumb{background:var(--faint)}

.tttwrap{position:absolute;right:100px;bottom:26px;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.5;transition:opacity .3s;z-index:1}
.tttwrap:hover,.tttwrap:focus-within,.tttwrap.live{opacity:1}
.single .tttwrap{right:94px;bottom:26px}
.ttt{position:relative;width:96px;height:96px;flex:none;color:var(--pen)}
.ttt svg.grid,.ttt svg.win{position:absolute;inset:0;overflow:visible;pointer-events:none}
.ttt .cell{position:absolute;width:33.333%;height:33.333%;cursor:var(--cur-pencil,crosshair);border-radius:4px}
.ttt .cell:hover{background:color-mix(in srgb,var(--pen) 5%,transparent)}
.ttt .cell svg{width:100%;height:100%;overflow:visible;display:block}
.ttt-cap{font-family:var(--hand);font-size:13px;line-height:1.05;color:var(--pen);width:130px;min-height:14px;text-align:center;margin:0}
.ttt-cap button{font-family:var(--hand);font-size:13px;color:var(--pen);text-decoration:underline;text-underline-offset:3px;min-height:32px}
@keyframes tdraw{to{stroke-dashoffset:0}}
.fresh path{stroke-dasharray:100;stroke-dashoffset:100;animation:tdraw .55s ease-out forwards}
@media (prefers-reduced-motion:reduce){.fresh path{animation:none;stroke-dashoffset:0}}

/* control bar */
#bar[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#toggles{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px}
.tg[hidden]{display:none}
body.zoomed #toggles{background:color-mix(in srgb,var(--page) 88%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:999px;box-shadow:0 0 0 1px var(--line)}
.tg{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:color .2s,background-color .2s,transform .25s}
.tg:hover,.tg:focus-visible{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tg:active{transform:scale(.92)}
.tg svg{display:block}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;
  padding:4px 6px;background:var(--bar);border:1px solid var(--bar-line);border-radius:999px;font-family:var(--mono);font-size:11.5px;color:var(--bar-muted);max-width:calc(100vw - 32px);box-sizing:border-box}
#bar button{height:36px;padding:0 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;color:var(--bar-ink)}
#bar button:hover{background:var(--bar-hover)}
#bar button:disabled{opacity:.3;cursor:default;background:none}
#bar .sep{width:1px;height:18px;background:var(--bar-line);margin:0 2px}
#where{min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
#bar .grp{display:flex;align-items:center;gap:2px}
@media (max-width:560px){#bar{width:calc(100vw - 32px);border-radius:18px;row-gap:0}#bar .sep{display:none}#bar .grp{width:100%;justify-content:space-between}#where{min-width:0;flex:1}#bar button{padding:0 9px}}
@media (prefers-reduced-motion:reduce){.tab,.corner::before{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div id="box">
    <div id="fit">
      <div class="book spread" id="book">
        <div class="openshade" id="oshade"></div>
        <div class="bookbg" id="bookbg"></div>
        <div class="slot" id="L"></div>
        <div class="slot" id="R"></div>
        <canvas id="ink" aria-hidden="true"></canvas>
        <div class="cast" id="cast"></div>
        <div class="leaf" id="leaf" hidden></div>
        <div class="cover" id="cover" role="button" tabindex="0" aria-label="Open the notebook">
          <div class="face front">
            <div class="cv">
              <div class="spine"></div><div class="band"></div>
              <div class="label" id="label">
                <small>NO. 01 · HUMAN WORKSPACE</small>
                <div class="sigline"><span class="sig">Keshav Tiwari</span></div>
              </div>
              <div class="doodle" hidden></div>
            </div>
            <div class="shade" id="coverShadeF"></div>
          </div>
          <div class="face back" id="coverB"></div>
        </div>
        <div class="cover" id="backBoard" role="button" tabindex="0" aria-label="Open the notebook from the back" hidden>
          <div class="face front" id="bbF"></div>
          <div class="face back" id="bbB"></div>
          <div class="tabs ride" id="tabF" aria-hidden="true"></div>
          <div class="tabs ride mirror" id="tabB" aria-hidden="true"></div>
        </div>
        <button class="corner next" id="cNext" aria-label="Turn to the next page" hidden></button>
        <button class="corner prev" id="cPrev" aria-label="Turn to the previous page" hidden></button>
        <nav class="tabs" id="tabs" aria-label="Chapters"></nav>
      </div>
      <div id="hint"><button id="hPrev" aria-label="Previous page">←</button><span id="pgnum">cover</span><button id="hNext" aria-label="Next page">→</button></div>
    </div>
  </div>
</div>

<div class="agent" id="agent" hidden>
  <button class="ag-mini" id="agMini" aria-expanded="false" aria-controls="agCard"><span class="ag-hint" id="agHint">what is keshav up to right now?</span></button>
</div>
<div class="ag-card closed" id="agCard" role="dialog" aria-label="Ask the sticky note">
  <div class="ag-top"><small>STICKY NOTE · ASK ABOUT KESHAV</small><button id="agClose" aria-label="Put the note back">×</button></div>
  <div class="ag-ans" id="agAns" aria-live="polite"></div>
  <div class="ag-sugg" id="agSugg"></div>
  <form class="ag-form" id="agForm"><label for="agIn" class="sr">Your question</label><input id="agIn" autocomplete="off" maxlength="200" placeholder="write a question…"><button type="submit">ASK →</button></form>
  <div class="ag-foot"><span id="agNote"></span><button id="agPin" hidden>stick this on the page</button></div>
</div>
<div id="letterDim" hidden></div>
<div id="letter" role="dialog" aria-modal="true" aria-label="Essay" hidden></div>
<span id="where" class="sr" aria-live="polite">Closed</span>
<div id="toggles">
  <button id="tFit" class="tg" aria-label="Back to normal size" hidden></button>
  <button id="tTheme" class="tg" aria-label="Switch to dark mode"></button>
  <button id="tSound" class="tg" aria-pressed="true" aria-label="Sound"></button>
</div>
<div id="bar" hidden>
  <div class="grp"><button id="bPrev" aria-label="Previous page"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M9 2 4 7l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  
  <button id="bNext" aria-label="Next page"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="m5 2 5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <span class="sep"></span><div class="grp">
  <button id="bSound" aria-pressed="true">Sound on</button>
  <button id="bTheme">Theme: auto</button>
  <button id="bTabs">Tabs: ink</button>
  <button id="bClose">Close</button></div>
</div>

<script>
(function(){
'use strict';
var root = document.documentElement;
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id){ return document.getElementById(id); }
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* ---------- content ---------- */
var CIRCLE = '<svg viewBox="0 0 100 40" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M8 22C4 9 40 3 70 5c22 2 30 14 20 24C78 40 30 39 12 30 6 27 6 22 12 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
function go(page, title, sub, yr){
  return '<li><button class="go" data-go="{{'+page+'}}"><span class="top"><span><b>'+title+'</b> <span class="m">'+sub+'</span></span><span class="yr">'+(yr||'')+'<i class="arr" aria-hidden="true">→</i></span></span></button></li>';
}
function role(title, sub, yr, bullets, note){
  return '<div class="it"><div class="top"><span><b>'+title+'</b> <span class="m">'+sub+'</span></span><span class="yr">'+yr+'</span></div>'+
    '<ul class="bul sm">'+bullets.map(function(b){ return '<li>'+b+'</li>'; }).join('')+'</ul>'+(note ? '<span class="note">'+note+'</span>' : '')+'</div>';
}
function gl(page, title, sub, yr, line){
  var inner = '<span class="top"><span><b>' + title + '</b> <span class="m">' + sub + '</span></span><span class="yr">' + (yr || '') + (page != null ? '<i class="arr" aria-hidden="true">→</i>' : '') + '</span></span>' + (line ? '<span class="gl">' + line + '</span>' : '');

ourse that teaches the critical skills needed to pursue a technical data-focused career.</strong> Specifically, this course is focused on working with real data, critical thinking, and improving one’s programming skills in Python. This course requires students to complete technical assignments and weekly conceptual quizzes individually as well as participate in a large quarter-long group project. For this project, students carry out the entire data science process: formulating a question, finding, cleaning and analyzing the data to answer their question of interest, and communicating their process and findings in a detailed, technical data science report.\n\nFor his final project, Keshav and his group set out to answer the question “What is the relationship between the racial backgrounds and urbanization levels of western and eastern states, and what is their effect on COVID-19 mortality rates in the USA?” Students are encouraged to choose a specific question on a topic that matters to them, their communities, or society at large. Given the huge impact of COVID-19 in general and outsized impact on students, this was a great project topic choice. Their final report was well-analyzed, effectively-visualized, clearly-communicated, and thoughtful overall. Keshav was involved with the group consistently throughout, playing a role in ideation, data wrangling, background research, writing, data visualization, and analysis. Further, <strong>Keshav’s teammates all had positive things to say about Keshav’s performance on the project</strong>. For his efforts on this project and consistently strong performance throughout the course, Keshav earned an A in this course. Together, this demonstrates his <strong>strong programming and analytic skills</strong>, as well as his <strong>ability to work both independently and collaboratively toward a shared goal</strong>.\n\nGiven all of the above, I want to of course summarize that Keshav is technically strong and will succeed in an engineering, machine learning, or data science-centric role. But, many of your applicants are technically qualified. <strong>Keshav stands out in the crowd due to his work ethic, passion for learning, personable nature, ability to work both independently and collaboratively, and his ability to make a team better by his being on it</strong>. You want Keshav on your team. Given all of this, I am so excited to recommend Keshav for your internship!\n\nSincerely," },

}
function lastPos(){ return mode === 'spread' ? Math.ceil(N/2) - 1 : N - 1; }
function currentChapter(){ var i = mode === 'spread' ? 2*pos + 1 : pos; i = Math.min(i, N-1); return PAGES[i].ch; }

function render(){

  else { R.innerHTML = pageHTML(pos, 'single'); L.innerHTML = ''; }

  renderTabs(); updateBar(); mountVideos();
  if(typeof paintAgent === 'function' && agent) paintAgent();

/* A page is cut into vertical strips that each rotate a little more than the last,
   so the sheet bends as it turns. The cover is board, so it stays stiff. */
var CURL = { strips: 24, bend: 62, lift: 0.6 };
function buildCurl(frontHTML, backHTML, side, n){
  var sw = PW / n, strips = [], fronts = [], backs = [], fsh = [], bsh = [];
  var parent = leaf;
  for(var i = 0; i < n; i++){
    var st = document.createElement('div'); st.className = 'strip';
    st.style.width = (sw + 1) + 'px';
    if(side === 'r'){ st.style.left = (i === 0 ? 0 : sw) + 'px'; st.style.transformOrigin = 'left center'; }
    else { st.style.left = (i === 0 ? PW - sw : -sw) + 'px'; st.style.transformOrigin = (i === 0 ? sw : sw) + 'px 50%'; }
    var fOff = side === 'r' ? -i * sw : -(PW - (i + 1) * sw);
    var bOff = side === 'r' ? -(PW - (i + 1) * sw) : -i * sw;
    var f = document.createElement('div'); f.className = 'sface front';
    f.innerHTML = '<div class="inner" style="left:' + fOff + 'px;width:' + PW + 'px">' + frontHTML + '</div><div class="sshade"></div>';
    var bk = document.createElement('div'); bk.className = 'sface back';
    bk.innerHTML = '<div class="inner" style="left:' + bOff + 'px;width:' + PW + 'px">' + backHTML + '</div><div class="sshade"></div>';
    st.appendChild(f); st.appendChild(bk); parent.appendChild(st); parent = st;
    strips.push(st); fronts.push(f); backs.push(bk); fsh.push(f.lastChild); bsh.push(bk.lastChild);
  }

  var w = [], tot = 0; for(var k = 1; k < n; k++){ var v = Math.pow(k / n, 1.6); w.push(v); tot += v; }
  w = w.map(function(v){ return v / tot; });

    var sgn = side === 'r' ? -1 : 1;
    var base = 180 * p * sgn;
    var bend = Math.sin(Math.PI * p) * CURL.bend * sgn;
    var cum = base, prev = base;
    for(var i = 0; i < n; i++){
      if(i === 0){ strips[0].style.transform = 'rotateY(' + base + 'deg) translateZ(' + (CURL.lift * Math.sin(Math.PI * p)) + 'px)'; }
      else {
        var target = cum + bend * w[i - 1];

        var d = target - cum; cum = target;
        strips[i].style.transform = 'rotateY(' + d + 'deg)';

      var a = Math.abs(cum) * Math.PI / 180;
      var frontUp = Math.abs(cum) < 90;
      fronts[i].style.visibility = frontUp ? 'visible' : 'hidden';
      backs[i].style.visibility = frontUp ? 'hidden' : 'visible';
      var shade = Math.sin(a);
      fsh[i].style.opacity = String(shade * .28);
      bsh[i].style.opacity = String(shade * .22);
    }
  };
}
function setupTurn(dir, target){

var ESSAY_IS_DRAFT = false;  // the essay is Keshav's own
var LETTERS = [{
  title:'The blank page is doing the work', date:'fall 2026', kind:'essay',
  body:[
    'A friend recently asked me if using AI has made me dumber. Almost insulted, I rushed to say no. Defiantly, I challenged myself to write without AI assistance. As a blank page stared back at me, his question got louder and my answer stopped feeling true. My friend isn’t alone in asking this question though. Type “does using AI make me” into Google and “dumber” is among its first suggestions. In wonder, does science share our concern? Are the productivity gains of AI enough to justify our “cognitive surrender”? And should we be doing something about it?',
    'The ideas in this essay didn’t stem from a prompt. They came to me on a walk as I wrestled with what to write about. I thought to myself, “I do love talking about how technology helps us think. How do I make this more personal though? Oh no, I forgot I had an assignment due for my design class. Maybe I’ll just ask ChatGPT for a draft ... ahh but I really enjoy coming up with writing ideas though … oh wait!” One thought led to the next until the connections formed on their own. My favorite chatbot could have handed me a perfectly serviceable list of angles, but it could never have given me that walk. AI tools often sell themselves as the cure for the blank page. My argument is that the blank page was doing the work, and the best tools should protect some of that struggle.',
    'The science behind this is relatively young, and much of it is self-reported. In a CHI 2025 survey of 319 knowledge workers, people who trusted generative AI more reported thinking less critically about its output, while people who trusted their own skills reported thinking more [1]. The more we believe the machine, the less we check it. Researchers call this automation bias: accepting a machine’s output without checking it. A recently published review traces it across healthcare, finance, public administration, and national security [2]. That exact moment when the checking stops and blind acceptance begins is the “cognitive surrender.” It is also less simple than blind obedience. In survey experiments on algorithmic advice in a personnel decision, people did not automatically defer to algorithms over humans. They followed advice selectively, leaning on it when it matched what they already believed [3]. The AI hands us what we suspected, and we stop there. Being challenged takes effort, and a tool that removes the effort removes the challenge too.',
    'The usual fix is to make the AI explain itself, however, the same review finds that explanations alone often fail to cure overreliance and can even inflate confidence in wrong answers [2]. Human-computer interaction research offers a stranger idea: create friction on purpose. In one experiment, interface designs that forced people to engage before accepting an AI recommendation, called cognitive forcing functions, cut overreliance more than standard explanations did [4]. The catch is that participants rated those ‘friction’ designs the least favorable of all [4]. Much like the vitamins you know you should be taking, what helps us is often what we avoid. Thus, designers must redesign incentives to embrace the friction to empower a less dependent user.',
    'Friction does not necessarily mean having a locked door. Another study tested this with an AI system that shows only part of its reasoning so the user has to fill in the rest. Across two experiments with 264 and 210 participants, partial explanations led people to accept fewer wrong suggestions than a bare recommendation did, though a full explanation still did better overall [5]. Notably, the people who engaged most with the task gained the most [5]. Friction rewards those who want to engage, otherwise a thoughtful implementation may just be evaluated as poor design.',
    'So here is my proposal for any AI tool people use to think, whether for writing, coding, or deciding. First, hold back the answer until the user has made a reasonable attempt. Second, say when friction is on and why so the user always feels in control. Third, let the user dial it up or down, the way a video game lets you pick a difficulty. Nobody feels tricked by a difficulty setting they self-elected into.',
    'A fair objection here would be: I use AI to move fast, and nobody wants a tool that quizzes them before drafting an email. I can’t help but say touché. For some, a blank page is a real barrier, whether from writing in a second language or from writer’s block. Friction, though, should scale with the stakes. Rewording a message is a low stakes activity that needs none. A medical note, a code review, or a financial decision has earned a pause, and those are the very settings the automation bias research covers [2]. Friction can also follow trust. Because confidence in the AI predicts less checking [1], a tool could add a pause exactly when a user is most dependent. Lastly, since friction helps some people more than others [4], [5], adjustability must be a core part of the design.',
    'So what can you do? If you design or build AI products, ship a "try first" option and test it on people who dislike effortful thinking as well as those who enjoy it. Ask which decisions in a workflow deserve a pause. If you use these tools, switch friction on for the work you want to get better at or maybe just go take a walk before you default to a chat window. It’s like going to the gym for the mind. The industrial revolution relaxed physical effort from our daily lives and we built gyms to bring that back. Mental effort might just be next.',
    'So, does using AI make us dumber? It absolutely can if we use it to dodge the blank page. Perhaps, I was wrong to reject my friend’s question. I would answer differently now, not because this page isn’t blank anymore, but because I made the effort to think first.'
  ],
  refs:[
    'H.-P. Lee et al., “The impact of generative AI on critical thinking: Self-reported reductions in cognitive effort and confidence effects from a survey of knowledge workers,” CHI ’25, Yokohama, Apr. 2025. <a href="https://doi.org/10.1145/3706598.3713778" target="_blank" rel="noopener">doi</a>',
    'G. Romeo and D. Conti, “Exploring automation bias in human–AI collaboration: A review and implications for explainable AI,” AI &amp; Society, vol. 41, no. 1, Jan. 2026. <a href="https://doi.org/10.1007/s00146-025-02422-7" target="_blank" rel="noopener">doi</a>',
    'S. Alon-Barkat and M. Busuioc, “Human–AI interactions in public sector decision making: ‘Automation bias’ and ‘selective adherence’ to algorithmic advice,” J. Public Admin. Res. Theory, vol. 33, no. 1, Jan. 2023. <a href="https://doi.org/10.1093/jopart/muac007" target="_blank" rel="noopener">doi</a>',
    'Z. Buçinca, M. B. Malaya, and K. Z. Gajos, “To trust or to think: Cognitive forcing functions can reduce overreliance on AI in AI-assisted decision-making,” Proc. ACM HCI, CSCW1, Apr. 2021. <a href="https://doi.org/10.1145/3449287" target="_blank" rel="noopener">doi</a>',

    return { i:i, quip:String(r.quip || '').toLowerCase().slice(0, 40) };
  }).catch(function(){
    return { i:localMove(), quip:QUIPS[Math.floor(Math.random() * QUIPS.length)] };
  }).then(function(m){
    if(TTT.over || TTT.board[m.i]) return;
    sound.signature(.55);
    TTT.turn = 'x'; TTT.cap = m.quip || 'your move.';
    tttPlace(m.i, 'o', oPath());
  });
}
function tttReset(){
  TTT.board = [null,null,null,null,null,null,null,null,null]; TTT.marks = []; TTT.over = null; TTT.line = null; TTT.turn = 'x'; TTT.fresh = -1;
  TTT.cap = ''; sound.lift(); render();
}
book.addEventListener('click', function(e){ if(e.target.closest('.ttt-again')){ e.preventDefault(); tttReset(); } });
book.addEventListener('keydown', function(e){
  var c = e.target.closest && e.target.closest('.ttt .cell'); if(!c || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault(); var i = +c.dataset.cell;
  if(TTT.over || TTT.turn !== 'x' || TTT.board[i]) return;
  tttPlace(i, 'x', { d:X_PATH }); if(!TTT.over){ TTT.turn = 'o'; TTT.cap = 'hmm…'; render(); setTimeout(tttReply, 450); }
});

/* ---------- controls ---------- */
cover.addEventListener('click', function(){ if(eatClick) return; openBook(false); });
/* the cover lifts a little under your hand, so it reads as something that opens */
var lifted = 0;
function liftCover(to){ if(!closed || busy || lifted === to || RM) return; var from = lifted; lifted = to; tween(applyCover, from, to, 320); }
cover.addEventListener('pointerenter', function(e){ if(e.pointerType === 'mouse') liftCover(.04); });
cover.addEventListener('pointerleave', function(){ liftCover(0); });
setTimeout(function(){ if(closed && !busy && !lifted && !RM){ liftCover(.05); setTimeout(function(){ liftCover(0); }, 520); } }, 1600);
cover.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openBook(false); } });
$('hPrev').addEventListener('click', function(){ step(-1); });
$('hNext').addEventListener('click', function(){ step(1); });
tabsEl.addEventListener('click', function(e){
  var b = e.target.closest('.tab'); if(!b || busy) return;
  sound.wake(); sound.tab();
  var k = +b.dataset.k;
  if(!closed && !backClosed && k === currentChapter()) return;
  jumpToChapter(k);
});
function step(dir){
  if(letterOpen || letterBusy) return;
  sound.wake();
  if(dir > 0){ if(closed) openBook(false); else if(backClosed) flipOver('front'); else if(pos >= lastPos()) closeBack(); else turn(1); }
  else { if(backClosed) openBack(); else if(closed) flipOver('back'); else if(pos <= 0) closeBook(); else turn(-1); }
}
$('bPrev').addEventListener('click', function(){ step(-1); });
$('bNext').addEventListener('click', function(){ step(1); });
$('bClose').addEventListener('click', function(){ sound.wake(); closeBook(); });
var bSound = $('bSound');
function paintSound(){ bSound.textContent = sound.on ? 'Sound on' : 'Sound off'; bSound.setAttribute('aria-pressed', String(sound.on)); }
bSound.addEventListener('click', function(){ sound.wake(); sound.toggle(); paintSound(); });
paintSound();
var themes = ['auto', 'light', 'dark'], ti = Math.max(0, themes.indexOf(store('nb-theme') || 'auto'));
function paintTheme(){ var t = themes[ti]; if(t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t); $('bTheme').textContent = 'Theme: ' + t; paintCursors(); }
$('bTheme').addEventListener('click', function(){ ti = (ti + 1) % themes.length; store('nb-theme', themes[ti]); paintTheme(); sound.wake(); sound.tab(); });
paintTheme();
var tabStyle = store('nb-tabs') === 'red' ? 'red' : 'ink';
function paintTabs(){ root.setAttribute('data-tabs', tabStyle); $('bTabs').textContent = 'Tabs: ' + tabStyle; }
$('bTabs').addEventListener('click', function(){ tabStyle = tabStyle === 'ink' ? 'red' : 'ink'; store('nb-tabs', tabStyle); paintTabs(); sound.wake(); sound.tab(); });
paintTabs();
var ICON = {
  moon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.6 14.8A8 8 0 0 1 9.3 4.3c-3.4 1.1-5.6 4.4-5.3 8.1.4 4.2 3.9 7.5 8.1 7.6 3.2.1 6.1-1.9 7.5-5.2z"/></svg>',
  sun:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 7.6c2.5-.1 4.5 1.9 4.4 4.5-.1 2.4-2 4.3-4.5 4.3-2.4 0-4.3-2-4.3-4.4 0-2.5 2-4.4 4.4-4.4z"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.3 5.4l1.4 1.4M17.3 17.3l1.4 1.4M5.4 18.7l1.4-1.4M17.4 6.6l1.3-1.3"/></svg>',
  on:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.6h3.3L12 5.4v13.2l-4.7-4.2H4z"/><path d="M15.6 9.2c1.3 1.6 1.3 4 0 5.6M18.3 6.7c2.6 2.9 2.6 7.6 0 10.6"/></svg>',
  fit:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.2V4.3h4.9M15.1 4.2H20v4.9M20 14.9v4.8h-4.9M8.9 19.8H4v-4.9"/><path d="M9.4 9.5h5.2v5.1H9.4z"/></svg>',
  off:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.6h3.3L12 5.4v13.2l-4.7-4.2H4z"/><path d="M16 9.6l4.6 4.8M20.6 9.6 16 14.4"/></svg>'
};
function isDark(){ var t = root.getAttribute('data-theme'); return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function paintToggles(){
  var d = isDark(), tt = $('tTheme'), ts = $('tSound');
  tt.innerHTML = d ? ICON.sun : ICON.moon; tt.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode');
  var tf = $('tFit'); tf.innerHTML = ICON.fit; tf.hidden = Math.abs(zoom - 1) < .005;
  ts.innerHTML = sound.on ? ICON.on : ICON.off; ts.setAttribute('aria-pressed', String(sound.on)); ts.setAttribute('aria-label', sound.on ? 'Sound on' : 'Sound off');
}
$('tTheme').addEventListener('click', function(){
  var next = isDark() ? 'light' : 'dark'; ti = themes.indexOf(next); store('nb-theme', next); paintTheme(); paintToggles(); sound.wake(); sound.tab();
});
$('tFit').addEventListener('click', function(){ sound.wake(); sound.tab(); setZoom(1); });
$('tSound').addEventListener('click', function(){ sound.wake(); sound.toggle(); paintSound(); paintToggles(); if(sound.on) sound.tab(); });
if(window.matchMedia) try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintToggles); }catch(e){}
paintToggles();
document.addEventListener('keydown', function(e){
  if(e.target.closest && e.target.closest('input,textarea')) return;
  var dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if(!dir) return;
  if(e.repeat){ if(!riff) riffle(dir); return; }   // hold an arrow key to riffle
  step(dir);
});
/* zoom: pinch on a trackpad or with two fingers, ctrl/cmd + scroll, or ctrl/cmd + plus, minus and 0 */
var zraf = 0;
function setZoom(z){
  z = Math.max(.6, Math.min(1.6, Math.round(z * 100) / 100));
  if(z === zoom || busy || letterOpen) return;
  zoom = z; store('nb-zoom', String(z)); if(typeof paintToggles === 'function') paintToggles();
  if(!zraf) zraf = requestAnimationFrame(function(){ zraf = 0; layout(); });
}
window.addEventListener('wheel', function(e){
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY * .01));
}, { passive:false });
var gz = 1; // Safari's own pinch events
document.addEventListener('gesturestart', function(e){ e.preventDefault(); gz = zoom; });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); setZoom(gz * e.scale); });
document.addEventListener('keydown', function(e){
  if(!(e.ctrlKey || e.metaKey)) return;
  if(e.key === '=' || e.key === '+'){ e.preventDefault(); setZoom(zoom * 1.1); }
  else if(e.key === '-' || e.key === '_'){ e.preventDefault(); setZoom(zoom / 1.1); }
  else if(e.key === '0'){ e.preventDefault(); setZoom(1); }
});
var touches = {}, pinch = null;
function tdist(){ var k = Object.keys(touches); if(k.length < 2) return 0; var a = touches[k[0]], b = touches[k[1]]; return Math.hypot(a.x - b.x, a.y - b.y); }
document.addEventListener('pointerdown', function(e){
  if(e.pointerType !== 'touch') return;
  touches[e.pointerId] = { x:e.clientX, y:e.clientY };
  if(Object.keys(touches).length === 2){
    // a second finger means zoom, not drawing
    if(cur){ var s = cur; cur = null; strokes = strokes.filter(function(x){ return x !== s; }); sound.pencil(0); }
    pinch = { d0:tdist(), z0:zoom };
  }
}, true);
document.addEventListener('pointermove', function(e){
  if(!touches[e.pointerId]) return;
  touches[e.pointerId] = { x:e.clientX, y:e.clientY };
  if(pinch && pinch.d0 > 20) setZoom(pinch.z0 * tdist() / pinch.d0);
}, true);
['pointerup', 'pointercancel'].forEach(function(ev){ document.addEventListener(ev, function(e){ delete touches[e.pointerId]; if(Object.keys(touches).length < 2) pinch = null; }, true); });
var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ if(!busy) layout(); }, 120); });
layout();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(!busy) layout(); });
})();
